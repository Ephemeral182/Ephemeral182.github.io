<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 动态背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 25%, #0f0f23 50%, #000000 100%);
            z-index: -2;
        }
        
        /* 动态光效 */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        .glow-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .glow-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .glow-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-menu a:hover::after {
            width: 100%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1400px; /* 由 1200px 修改为 1600px */
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 - Leonardo.ai风格 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 100vh;
            gap: 4rem;
            position: relative;
            padding: 4rem 0;
        }
        
        .hero-content {
            max-width: 500px; /* 稍微增加宽度以容纳论文信息 */
            margin-left: 6rem;  /* 稍微调整左边距 */
        }
        
        .hero-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .hero-title {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        
        /* Hero Visual - Leonardo.ai风格拼贴 */
        .hero-visual {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            gap: 2rem;
        }
        
        .mosaic-grid {
            position: relative;
            width: 550px; /* 稍微减小 */
            height: 550px;
            margin: 0 auto;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        .mosaic-item {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
        }
        
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        /* 重新设计布局 - 完全无重叠，紧密但清晰的拼贴 */
        .mosaic-1 {
            width: 160px;   /* 大尺寸 */
            height: 230px;  
            top: 30px;
            left: 30px;
            transform: rotate(-8deg);
            z-index: 8;
            animation: itemFloat1 4s ease-in-out infinite;
        }
        
        .mosaic-2 {
            width: 120px;   /* 中等尺寸 */
            height: 170px;  
            top: 50px;
            left: 220px;    /* 确保与mosaic-1不重叠 */
            transform: rotate(12deg);
            z-index: 7;
            animation: itemFloat2 4.5s ease-in-out infinite;
        }
        
        .mosaic-3 {
            width: 140px;   /* 中大尺寸 */
            height: 200px;  
            top: 30px;
            left: 370px;    /* 确保与mosaic-2不重叠 */
            transform: rotate(-5deg);
            z-index: 9;
            animation: itemFloat3 3.8s ease-in-out infinite;
        }
        
        .mosaic-4 {
            width: 110px;   /* 中等尺寸 */
            height: 160px;  
            top: 280px;     /* 确保与mosaic-1不重叠 */
            left: 20px;
            transform: rotate(10deg);
            z-index: 6;
            animation: itemFloat4 4.2s ease-in-out infinite;
        }
        
        .mosaic-5 {
            width: 150px;   /* 大尺寸 */
            height: 215px;  
            top: 250px;     /* 确保与mosaic-2不重叠 */
            left: 160px;
            transform: rotate(-12deg);
            z-index: 5;
            animation: itemFloat5 3.9s ease-in-out infinite;
        }
        
        .mosaic-6 {
            width: 100px;   /* 小尺寸 */
            height: 145px;  
            top: 260px;     /* 确保与mosaic-3不重叠 */
            left: 340px;
            transform: rotate(7deg);
            z-index: 4;
            animation: itemFloat6 4.3s ease-in-out infinite;
        }
        
        .mosaic-7 {
            width: 155px;   /* 大尺寸 */
            height: 225px;  
            top: 470px;     /* 底部行，确保与上方不重叠 */
            left: 40px;
            transform: rotate(-10deg);
            z-index: 3;
            animation: itemFloat7 4.1s ease-in-out infinite;
        }
        
        .mosaic-8 {
            width: 125px;   /* 中大尺寸 */
            height: 180px;  
            top: 490px;     /* 底部行 */
            left: 220px;
            transform: rotate(15deg);
            z-index: 2;
            animation: itemFloat8 3.7s ease-in-out infinite;
        }
        
        /* 证言卡片 */
        .testimonial-card {
            position: absolute;
            bottom: -180px;  /* 向下移动更多 */
            right: -120px;   /* 向右移动更多 */
            width: 440px;    /* 增加宽度 */
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: fadeInUp 1s ease-out 1s both;
        }
        
        .quote-icon {
            font-size: 3rem;
            color: #6366f1;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .testimonial-text {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        
        .testimonial-author strong {
            color: #ffffff;
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        
        .testimonial-author span {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* 特性卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin: 6rem 0 4rem;
        }
        
        .feature-card {
            background: transparent; /* 修改 */
            border: none; /* 修改 */
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: none; /* 修改 */
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            /* background: rgba(255, 255, 255, 0.08); */ /* 移除背景变化 */
            /* border-color: rgba(99, 102, 241, 0.3); */   /* 移除边框颜色变化 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); /* 保留阴影效果 */
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .feature-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .feature-description {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 响应式设计 - 确保所有尺寸下都不重叠 */
        @media (max-width: 1200px) {
            .mosaic-grid {
                width: 550px;
                height: 600px;
            }
            
            /* 中等屏幕 - 重新计算位置避免重叠 */
            .mosaic-1 { width: 140px; height: 200px; top: 25px; left: 25px; }
            .mosaic-2 { width: 105px; height: 150px; top: 40px; left: 190px; }
            .mosaic-3 { width: 125px; height: 180px; top: 25px; left: 320px; }
            .mosaic-4 { width: 95px; height: 140px; top: 240px; left: 15px; }
            .mosaic-5 { width: 130px; height: 185px; top: 210px; left: 135px; }
            .mosaic-6 { width: 85px; height: 125px; top: 220px; left: 290px; }
            .mosaic-7 { width: 135px; height: 195px; top: 400px; left: 35px; }
            .mosaic-8 { width: 110px; height: 160px; top: 420px; left: 190px; }
        }
        
        @media (max-width: 768px) {
            .hero-visual {
                margin-top: 3rem;
            }
            
            .mosaic-grid {
                width: 450px;
                height: 500px;
            }
            
            /* 移动端 - 三行布局，确保不重叠 */
            .mosaic-1 { width: 115px; height: 165px; top: 20px; left: 20px; }
            .mosaic-2 { width: 85px; height: 122px; top: 30px; left: 155px; }
            .mosaic-3 { width: 100px; height: 145px; top: 20px; left: 260px; }
            .mosaic-4 { width: 80px; height: 115px; top: 200px; left: 15px; }
            .mosaic-5 { width: 105px; height: 150px; top: 180px; left: 115px; }
            .mosaic-6 { width: 70px; height: 100px; top: 190px; left: 240px; }
            .mosaic-7 { width: 110px; height: 160px; top: 340px; left: 30px; }
            .mosaic-8 { width: 90px; height: 130px; top: 360px; left: 160px; }
        }
        
        @media (max-width: 480px) {
            .mosaic-grid {
                width: 350px;
                height: 450px;
            }
            
            /* 小屏幕 - 更紧凑但不重叠 */
            .mosaic-1 { width: 90px; height: 130px; top: 15px; left: 15px; }
            .mosaic-2 { width: 70px; height: 100px; top: 20px; left: 120px; }
            .mosaic-3 { width: 80px; height: 115px; top: 15px; left: 210px; }
            .mosaic-4 { width: 65px; height: 95px; top: 160px; left: 10px; }
            .mosaic-5 { width: 85px; height: 122px; top: 145px; left: 90px; }
            .mosaic-6 { width: 60px; height: 86px; top: 150px; left: 190px; }
            .mosaic-7 { width: 90px; height: 130px; top: 280px; left: 25px; }
            .mosaic-8 { width: 75px; height: 108px; top: 300px; left: 130px; }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 浮动demo图片样式 */
        .floating-demos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .demo-left, .demo-right {
            position: absolute;
            top: 20%;
            width: 300px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.9;
        }
        
        .demo-left {
            left: 20px;
            transform: rotate(-15deg);
            animation: floatLeft 3s ease-in-out infinite alternate;
        }
        
        .demo-right {
            right: 20px;
            transform: rotate(15deg);
            animation: floatRight 3s ease-in-out infinite alternate;
        }
        
        .demo-left img, .demo-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 滚动时的散开效果 */
        .floating-demos.scrolled .demo-left {
            left: -280px;
            opacity: 0.3;
            transform: rotate(-25deg) scale(0.8);
        }
        
        .floating-demos.scrolled .demo-right {
            right: -280px;
            opacity: 0.3;
            transform: rotate(25deg) scale(0.8);
        }
        
        /* 新增：第二组demo图片样式 */
        .demo-second-left, .demo-second-right {
            position: absolute;
            top: 60%;
            width: 280px;
            height: 380px;
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: scale(0.5);
        }
        
        .demo-second-left {
            left: -50px;
            transform: rotate(-20deg) scale(0.5);
        }
        
        .demo-second-right {
            right: -50px;
            transform: rotate(20deg) scale(0.5);
        }
        
        .demo-second-left img, .demo-second-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 第二组图片出现的状态 */
        .floating-demos.second-phase .demo-second-left {
            left: 120px;
            opacity: 0.8;
            transform: rotate(-20deg) scale(1);
            animation: floatSecondLeft 4s ease-in-out infinite alternate;
        }
        
        .floating-demos.second-phase .demo-second-right {
            right: 120px;
            opacity: 0.8;
            transform: rotate(20deg) scale(1);
            animation: floatSecondRight 4s ease-in-out infinite alternate;
        }
        
        /* 第二组图片消失的状态 */
        .floating-demos.third-phase .demo-second-left {
            left: -250px;
            opacity: 0;
            transform: rotate(-30deg) scale(0.6);
        }
        
        .floating-demos.third-phase .demo-second-right {
            right: -250px;
            opacity: 0;
            transform: rotate(30deg) scale(0.6);
        }
        
        /* 第二组浮动动画 */
        @keyframes floatSecondLeft {
            0% { transform: rotate(-20deg) scale(1) translateY(0px); }
            100% { transform: rotate(-20deg) scale(1) translateY(-15px); }
        }
        
        @keyframes floatSecondRight {
            0% { transform: rotate(20deg) scale(1) translateY(0px); }
            100% { transform: rotate(20deg) scale(1) translateY(-15px); }
        }
        
        /* 原有的浮动动画 */
        @keyframes floatLeft {
            0% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(-15deg) translateY(-20px); }
        }
        
        @keyframes floatRight {
            0% { transform: rotate(15deg) translateY(0px); }
            100% { transform: rotate(15deg) translateY(-20px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .demo-left, .demo-right {
                width: 200px;
                height: 280px;
                top: 15%;
            }
            
            .demo-second-left, .demo-second-right {
                width: 180px;
                height: 260px;
                top: 55%;
            }
            
            .demo-left {
                left: 5px;
            }
            
            .demo-right {
                right: 5px;
            }
            
            .demo-second-left {
                left: -30px;
            }
            
            .demo-second-right {
                right: -30px;
            }
            
            .floating-demos.scrolled .demo-left {
                left: -220px;
            }
            
            .floating-demos.scrolled .demo-right {
                right: -220px;
            }
            
            .floating-demos.second-phase .demo-second-left {
                left: 60px;
            }
            
            .floating-demos.second-phase .demo-second-right {
                right: 60px;
            }
            
            .floating-demos.third-phase .demo-second-left {
                left: -200px;
            }
            
            .floating-demos.third-phase .demo-second-right {
                right: -200px;
            }
        }
        
        /* 确保主要内容在浮动元素之上 */
        .hero {
            position: relative;
            z-index: 2;
        }
        
        /* 添加轻柔的整体浮动动画 */
        @keyframes gentleFloat {
            0%, 100% { 
                transform: translateY(0px); 
            }
            50% { 
                transform: translateY(-10px); 
            }
        }
        
        /* 为每个项目定义独立的浮动动画 */
        @keyframes itemFloat1 {
            0%, 100% { transform: rotate(-8deg) translateY(0px); }
            50% { transform: rotate(-8deg) translateY(-8px); }
        }
        
        @keyframes itemFloat2 {
            0%, 100% { transform: rotate(12deg) translateY(0px); }
            50% { transform: rotate(12deg) translateY(-6px); }
        }
        
        @keyframes itemFloat3 {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(-5deg) translateY(-10px); }
        }
        
        @keyframes itemFloat4 {
            0%, 100% { transform: rotate(10deg) translateY(0px); }
            50% { transform: rotate(10deg) translateY(-7px); }
        }

                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .comparison-card:hover {
            transform: translateY(-10px);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 60px rgba(99, 102, 241, 0.3);

        /* 图片容器 - 保持832:1216比例 */
        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 832 / 1216; /* 设置为海报比例 */
            overflow: hidden;
            cursor: pointer;
        }

        .before-image,
        .after-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .before-image {
            opacity: 1;
            transform: scale(1); /* 移除放大效果，保持原始大小 */
        }

        .after-image {
            opacity: 0;
            transform: scale(1); /* 移除放大效果，保持原始大小 */
        }

        /* Hover效果 - 只改变透明度，不改变大小 */
        .comparison-card:hover .before-image {
            opacity: 0;
            transform: scale(1); /* 保持原始大小 */
        }

        .comparison-card:hover .after-image {
            opacity: 1;
            transform: scale(1); /* 保持原始大小 */
        }

        /* 标签 - 移到右边 */
        .overlay-label {
            position: absolute;
            top: 1rem;

        .comparison-card:hover .before-label {

        .comparison-card:hover .after-label {
            opacity: 1;

            pointer-events: none;
        }

        @keyframes logoFloatHero {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        @keyframes logoGlowHero {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.03); }
        }

        @media (max-width: 480px) {
            .title-logo-section {
                flex-direction: column;
                gap: 0.8rem;
            }
            
            .inline-logo {
                width: 40px;
            }

                font-size: 1.2rem;
            }
            
            .paper-links-enhanced {
                gap: 0.8rem;
            }
            
            .paper-link-fancy {
                padding: 0.8rem 1rem;
                font-size: 0.85rem;
            }
        }

        /* Text Optimization Showcase Section */
        .text-optimization-showcase {
            padding: 8rem 0;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        .optimization-container {
            max-width: 1800px; /* 增加最大宽度以容纳6组 */
            margin: 0 auto;
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .optimization-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .optimization-title {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, 
                #667eea 0%, 
                #764ba2 20%, 
                #f093fb 40%, 
                #f5576c 60%, 
                #4facfe 80%, 
                #00f2fe 100%);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: techGradientFlow 8s ease-in-out infinite;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .optimization-emoji {
            font-size: 3rem;
            margin: 1rem 0;
            display: inline-block;
            animation: techEmojiPulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }

        .optimization-subtitle {
            font-size: 1.4rem;
            color: #cbd5e1;
            font-weight: 300;
            letter-spacing: 0.5px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* 对比网格 - 修改为4列布局 */
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 改为4列布局 */
            gap: 1.5rem; /* 稍微减小间距以适应4列 */
            margin-bottom: 5rem;
        }

        .comparison-item {
            position: relative;
        }

        .comparison-card {
            background: linear-gradient(135deg, 
                rgba(15, 23, 42, 0.8) 0%, 
                rgba(30, 41, 59, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .comparison-card:hover {
            transform: translateY(-10px);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 60px rgba(99, 102, 241, 0.3);
        }

        /* 图片容器 - 保持832:1216比例 */
        .image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 832 / 1216; /* 设置为海报比例 */
            overflow: hidden;
            cursor: pointer;
        }

        .before-image,
        .after-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .before-image {
            opacity: 1;
            transform: scale(1); /* 移除放大效果，保持原始大小 */
        }

        .after-image {
            opacity: 0;
            transform: scale(1); /* 移除放大效果，保持原始大小 */
        }

        /* Hover效果 - 只改变透明度，不改变大小 */
        .comparison-card:hover .before-image {
            opacity: 0;
            transform: scale(1); /* 保持原始大小 */
        }

        .comparison-card:hover .after-image {
            opacity: 1;
            transform: scale(1); /* 保持原始大小 */
        }

        /* 标签 - 移到右边 */
        .overlay-label {
            position: absolute;
            top: 1rem;
            right: 1rem; /* 统一移到右边 */
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .before-label {
            background: rgba(239, 68, 68, 0.8);
            color: white;
            opacity: 1;
        }

        .after-label {
            background: rgba(34, 197, 94, 0.8);
            color: white;
            opacity: 0;
        }

        .comparison-card:hover .before-label {
            opacity: 0;
        }

        .comparison-card:hover .after-label {
            opacity: 1;
        }

        /* 分割线效果 - 注释掉或删除 */
        .comparison-divider {
            display: none; /* 直接隐藏分割线 */
            /* 或者完全删除这个样式块 */
        }

        /* 或者完全删除分割线相关的CSS */
        /*
        .comparison-divider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.8) 20%, 
                rgba(255, 255, 255, 0.8) 80%, 
                transparent 100%);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .comparison-card:hover .comparison-divider {
            opacity: 1;
        }
        */

        /* 整体卡片hover效果 - 减少变形 */
        .comparison-card:hover {
            transform: translateY(-5px); /* 减少上移距离 */
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5), /* 减少阴影强度 */
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 40px rgba(99, 102, 241, 0.2); /* 减少光晕强度 */
        }

        /* 文字高亮样式 */
        .text-highlight {
            color: #ef4444; /* 红色高亮 */
            font-weight: 600;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .text-highlight::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            opacity: 0.6;
        }

        /* 信息区域 */
        .comparison-info {
            padding: 1.2rem; /* 稍微减少padding以适应4列布局 */
        }

        .comparison-title {
            font-size: 1rem; /* 稍微减小字体以适应4列布局 */
            font-weight: 700;
            margin-bottom: 0.6rem;
            background: linear-gradient(45deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .comparison-description {
            color: #94a3b8;
            line-height: 1.5;
            font-size: 0.8rem; /* 稍微减小字体以适应4列布局 */
        }

        /* 统计信息 */
        .optimization-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, 
                rgba(99, 102, 241, 0.1) 0%, 
                rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            display: block;
        }

        .stat-label {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* 响应式设计 */
        @media (max-width: 1400px) {
            .comparison-grid {
                grid-template-columns: repeat(2, 1fr); /* 中等屏幕显示2列 */
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            .text-optimization-showcase {
                padding: 4rem 0;
            }
            
            .comparison-grid {
                grid-template-columns: 1fr; /* 小屏幕显示1列 */
                gap: 2rem;
            }
            
            .optimization-stats {
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }
            
            .stat-card {
                min-width: 250px;
            }
        }

        @media (max-width: 480px) {
            .comparison-info {
                padding: 1rem;
            }
            
            .stat-card {
                min-width: 200px;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景效果 -->
    <div class="bg-gradient"></div>
    <div class="bg-effects">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">{{ site.title }}</a>
            <ul class="nav-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/publications/">论文</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- 主要内容 -->
    <main class="main-content">
        {{ content }}
    </main>
    
    <!-- JavaScript -->
    <script>
        // 滚动动画
        function handleScrollAnimation() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.glow-orb');
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 0.02;
                const x = e.clientX * speed;
                const y = e.clientY * speed;
                
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            handleScrollAnimation();
            window.addEventListener('scroll', handleScrollAnimation);
        });
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            const floatingDemos = document.querySelector('.floating-demos');
            
            if (floatingDemos) {
                window.addEventListener('scroll', function() {
                    const scrollY = window.scrollY;
                    const windowHeight = window.innerHeight;
                    
                    // 第一阶段：初始散开效果
                    if (scrollY > 100) {
                        floatingDemos.classList.add('scrolled');
                    } else {
                        floatingDemos.classList.remove('scrolled');
                    }
                    
                    // 第二阶段：新的demo图片出现
                    if (scrollY > windowHeight * 0.3 && scrollY < windowHeight * 1.2) {
                        floatingDemos.classList.add('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    } else if (scrollY <= windowHeight * 0.3) {
                        floatingDemos.classList.remove('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    }
                    
                    // 第三阶段：第二组图片消失
                    if (scrollY > windowHeight * 1.2) {
                        floatingDemos.classList.add('third-phase');
                        floatingDemos.classList.remove('second-phase');
                    }
                });
            }
        });

        // Dataset tab switching
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.dataset-tab');
            const panels = document.querySelectorAll('.dataset-panel');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetDataset = this.getAttribute('data-dataset');
                    
                    // Remove active class from all tabs and panels
                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));
                    
                    // Add active class to clicked tab and corresponding panel
                    this.classList.add('active');
                    document.getElementById(targetDataset + '-panel').classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
