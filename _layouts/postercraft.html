<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 动态背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 25%, #0f0f23 50%, #000000 100%);
            z-index: -2;
        }
        
        /* 动态光效 */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        .glow-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .glow-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .glow-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-menu a:hover::after {
            width: 100%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1600px; /* 由 1200px 修改为 1600px */
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 - Leonardo.ai风格 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 100vh;
            gap: 4rem;
            position: relative;
            padding: 4rem 0;
        }
        
        .hero-content {
            flex: 1;
            max-width: 500px;
        }
        
        .hero-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .hero-title {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        
        /* Hero Visual - Leonardo.ai风格拼贴 */
        .hero-visual {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }
        
        .mosaic-grid {
            position: relative;
            width: 650px;
            height: 650px;
            margin: 0 auto;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        .mosaic-item {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
        }
        
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        /* 重新设计布局 - 完全无重叠，紧密但清晰的拼贴 */
        .mosaic-1 {
            width: 160px;   /* 大尺寸 */
            height: 230px;  
            top: 30px;
            left: 30px;
            transform: rotate(-8deg);
            z-index: 8;
            animation: itemFloat1 4s ease-in-out infinite;
        }
        
        .mosaic-2 {
            width: 120px;   /* 中等尺寸 */
            height: 170px;  
            top: 50px;
            left: 220px;    /* 确保与mosaic-1不重叠 */
            transform: rotate(12deg);
            z-index: 7;
            animation: itemFloat2 4.5s ease-in-out infinite;
        }
        
        .mosaic-3 {
            width: 140px;   /* 中大尺寸 */
            height: 200px;  
            top: 30px;
            left: 370px;    /* 确保与mosaic-2不重叠 */
            transform: rotate(-5deg);
            z-index: 9;
            animation: itemFloat3 3.8s ease-in-out infinite;
        }
        
        .mosaic-4 {
            width: 110px;   /* 中等尺寸 */
            height: 160px;  
            top: 280px;     /* 确保与mosaic-1不重叠 */
            left: 20px;
            transform: rotate(10deg);
            z-index: 6;
            animation: itemFloat4 4.2s ease-in-out infinite;
        }
        
        .mosaic-5 {
            width: 150px;   /* 大尺寸 */
            height: 215px;  
            top: 250px;     /* 确保与mosaic-2不重叠 */
            left: 160px;
            transform: rotate(-12deg);
            z-index: 5;
            animation: itemFloat5 3.9s ease-in-out infinite;
        }
        
        .mosaic-6 {
            width: 100px;   /* 小尺寸 */
            height: 145px;  
            top: 260px;     /* 确保与mosaic-3不重叠 */
            left: 340px;
            transform: rotate(7deg);
            z-index: 4;
            animation: itemFloat6 4.3s ease-in-out infinite;
        }
        
        .mosaic-7 {
            width: 155px;   /* 大尺寸 */
            height: 225px;  
            top: 470px;     /* 底部行，确保与上方不重叠 */
            left: 40px;
            transform: rotate(-10deg);
            z-index: 3;
            animation: itemFloat7 4.1s ease-in-out infinite;
        }
        
        .mosaic-8 {
            width: 125px;   /* 中大尺寸 */
            height: 180px;  
            top: 490px;     /* 底部行 */
            left: 220px;
            transform: rotate(15deg);
            z-index: 2;
            animation: itemFloat8 3.7s ease-in-out infinite;
        }
        
        /* 证言卡片 */
        .testimonial-card {
            position: absolute;
            bottom: -180px;  /* 向下移动更多 */
            right: -120px;   /* 向右移动更多 */
            width: 440px;    /* 增加宽度 */
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: fadeInUp 1s ease-out 1s both;
        }
        
        .quote-icon {
            font-size: 3rem;
            color: #6366f1;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .testimonial-text {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        
        .testimonial-author strong {
            color: #ffffff;
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        
        .testimonial-author span {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* 特性卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin: 6rem 0 4rem;
        }
        
        .feature-card {
            background: transparent; /* 修改 */
            border: none; /* 修改 */
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: none; /* 修改 */
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            /* background: rgba(255, 255, 255, 0.08); */ /* 移除背景变化 */
            /* border-color: rgba(99, 102, 241, 0.3); */   /* 移除边框颜色变化 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); /* 保留阴影效果 */
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .feature-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .feature-description {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 响应式设计 - 确保所有尺寸下都不重叠 */
        @media (max-width: 1200px) {
            .mosaic-grid {
                width: 550px;
                height: 600px;
            }
            
            /* 中等屏幕 - 重新计算位置避免重叠 */
            .mosaic-1 { width: 140px; height: 200px; top: 25px; left: 25px; }
            .mosaic-2 { width: 105px; height: 150px; top: 40px; left: 190px; }
            .mosaic-3 { width: 125px; height: 180px; top: 25px; left: 320px; }
            .mosaic-4 { width: 95px; height: 140px; top: 240px; left: 15px; }
            .mosaic-5 { width: 130px; height: 185px; top: 210px; left: 135px; }
            .mosaic-6 { width: 85px; height: 125px; top: 220px; left: 290px; }
            .mosaic-7 { width: 135px; height: 195px; top: 400px; left: 35px; }
            .mosaic-8 { width: 110px; height: 160px; top: 420px; left: 190px; }
        }
        
        @media (max-width: 768px) {
            .hero-visual {
                margin-top: 3rem;
            }
            
            .mosaic-grid {
                width: 450px;
                height: 500px;
            }
            
            /* 移动端 - 三行布局，确保不重叠 */
            .mosaic-1 { width: 115px; height: 165px; top: 20px; left: 20px; }
            .mosaic-2 { width: 85px; height: 122px; top: 30px; left: 155px; }
            .mosaic-3 { width: 100px; height: 145px; top: 20px; left: 260px; }
            .mosaic-4 { width: 80px; height: 115px; top: 200px; left: 15px; }
            .mosaic-5 { width: 105px; height: 150px; top: 180px; left: 115px; }
            .mosaic-6 { width: 70px; height: 100px; top: 190px; left: 240px; }
            .mosaic-7 { width: 110px; height: 160px; top: 340px; left: 30px; }
            .mosaic-8 { width: 90px; height: 130px; top: 360px; left: 160px; }
        }
        
        @media (max-width: 480px) {
            .mosaic-grid {
                width: 350px;
                height: 450px;
            }
            
            /* 小屏幕 - 更紧凑但不重叠 */
            .mosaic-1 { width: 90px; height: 130px; top: 15px; left: 15px; }
            .mosaic-2 { width: 70px; height: 100px; top: 20px; left: 120px; }
            .mosaic-3 { width: 80px; height: 115px; top: 15px; left: 210px; }
            .mosaic-4 { width: 65px; height: 95px; top: 160px; left: 10px; }
            .mosaic-5 { width: 85px; height: 122px; top: 145px; left: 90px; }
            .mosaic-6 { width: 60px; height: 86px; top: 150px; left: 190px; }
            .mosaic-7 { width: 90px; height: 130px; top: 280px; left: 25px; }
            .mosaic-8 { width: 75px; height: 108px; top: 300px; left: 130px; }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 浮动demo图片样式 */
        .floating-demos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .demo-left, .demo-right {
            position: absolute;
            top: 20%;
            width: 300px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.9;
        }
        
        .demo-left {
            left: 20px;
            transform: rotate(-15deg);
            animation: floatLeft 3s ease-in-out infinite alternate;
        }
        
        .demo-right {
            right: 20px;
            transform: rotate(15deg);
            animation: floatRight 3s ease-in-out infinite alternate;
        }
        
        .demo-left img, .demo-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 滚动时的散开效果 */
        .floating-demos.scrolled .demo-left {
            left: -280px;
            opacity: 0.3;
            transform: rotate(-25deg) scale(0.8);
        }
        
        .floating-demos.scrolled .demo-right {
            right: -280px;
            opacity: 0.3;
            transform: rotate(25deg) scale(0.8);
        }
        
        /* 新增：第二组demo图片样式 */
        .demo-second-left, .demo-second-right {
            position: absolute;
            top: 60%;
            width: 280px;
            height: 380px;
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: scale(0.5);
        }
        
        .demo-second-left {
            left: -50px;
            transform: rotate(-20deg) scale(0.5);
        }
        
        .demo-second-right {
            right: -50px;
            transform: rotate(20deg) scale(0.5);
        }
        
        .demo-second-left img, .demo-second-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 第二组图片出现的状态 */
        .floating-demos.second-phase .demo-second-left {
            left: 120px;
            opacity: 0.8;
            transform: rotate(-20deg) scale(1);
            animation: floatSecondLeft 4s ease-in-out infinite alternate;
        }
        
        .floating-demos.second-phase .demo-second-right {
            right: 120px;
            opacity: 0.8;
            transform: rotate(20deg) scale(1);
            animation: floatSecondRight 4s ease-in-out infinite alternate;
        }
        
        /* 第二组图片消失的状态 */
        .floating-demos.third-phase .demo-second-left {
            left: -250px;
            opacity: 0;
            transform: rotate(-30deg) scale(0.6);
        }
        
        .floating-demos.third-phase .demo-second-right {
            right: -250px;
            opacity: 0;
            transform: rotate(30deg) scale(0.6);
        }
        
        /* 第二组浮动动画 */
        @keyframes floatSecondLeft {
            0% { transform: rotate(-20deg) scale(1) translateY(0px); }
            100% { transform: rotate(-20deg) scale(1) translateY(-15px); }
        }
        
        @keyframes floatSecondRight {
            0% { transform: rotate(20deg) scale(1) translateY(0px); }
            100% { transform: rotate(20deg) scale(1) translateY(-15px); }
        }
        
        /* 原有的浮动动画 */
        @keyframes floatLeft {
            0% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(-15deg) translateY(-20px); }
        }
        
        @keyframes floatRight {
            0% { transform: rotate(15deg) translateY(0px); }
            100% { transform: rotate(15deg) translateY(-20px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .demo-left, .demo-right {
                width: 200px;
                height: 280px;
                top: 15%;
            }
            
            .demo-second-left, .demo-second-right {
                width: 180px;
                height: 260px;
                top: 55%;
            }
            
            .demo-left {
                left: 5px;
            }
            
            .demo-right {
                right: 5px;
            }
            
            .demo-second-left {
                left: -30px;
            }
            
            .demo-second-right {
                right: -30px;
            }
            
            .floating-demos.scrolled .demo-left {
                left: -220px;
            }
            
            .floating-demos.scrolled .demo-right {
                right: -220px;
            }
            
            .floating-demos.second-phase .demo-second-left {
                left: 60px;
            }
            
            .floating-demos.second-phase .demo-second-right {
                right: 60px;
            }
            
            .floating-demos.third-phase .demo-second-left {
                left: -200px;
            }
            
            .floating-demos.third-phase .demo-second-right {
                right: -200px;
            }
        }
        
        /* 确保主要内容在浮动元素之上 */
        .hero {
            position: relative;
            z-index: 2;
        }
        
        /* 添加轻柔的整体浮动动画 */
        @keyframes gentleFloat {
            0%, 100% { 
                transform: translateY(0px); 
            }
            50% { 
                transform: translateY(-10px); 
            }
        }
        
        /* 为每个项目定义独立的浮动动画 */
        @keyframes itemFloat1 {
            0%, 100% { transform: rotate(-8deg) translateY(0px); }
            50% { transform: rotate(-8deg) translateY(-8px); }
        }
        
        @keyframes itemFloat2 {
            0%, 100% { transform: rotate(12deg) translateY(0px); }
            50% { transform: rotate(12deg) translateY(-6px); }
        }
        
        @keyframes itemFloat3 {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(-5deg) translateY(-10px); }
        }
        
        @keyframes itemFloat4 {
            0%, 100% { transform: rotate(10deg) translateY(0px); }
            50% { transform: rotate(10deg) translateY(-7px); }
        }
        
        @keyframes itemFloat5 {
            0%, 100% { transform: rotate(-12deg) translateY(0px); }
            50% { transform: rotate(-12deg) translateY(-9px); }
        }
        
        @keyframes itemFloat6 {

    <!-- JavaScript -->
    <script>
        // 滚动动画
        function handleScrollAnimation() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.glow-orb');
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 0.02;
                const x = e.clientX * speed;
                const y = e.clientY * speed;
                
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            handleScrollAnimation();
            window.addEventListener('scroll', handleScrollAnimation);
        });
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            const floatingDemos = document.querySelector('.floating-demos');
            
            window.addEventListener('scroll', function() {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                
                // 第一阶段：初始散开效果
                if (scrollY > 100) {
                    floatingDemos.classList.add('scrolled');
                } else {
                    floatingDemos.classList.remove('scrolled');
                }
                
                // 第二阶段：新的demo图片出现
                if (scrollY > windowHeight * 0.3 && scrollY < windowHeight * 1.2) {
                    floatingDemos.classList.add('second-phase');
                    floatingDemos.classList.remove('third-phase');
                } else if (scrollY <= windowHeight * 0.3) {
                    floatingDemos.classList.remove('second-phase');
                    floatingDemos.classList.remove('third-phase');
                }
                
                // 第三阶段：第二组图片消失
                if (scrollY > windowHeight * 1.2) {
                    floatingDemos.classList.add('third-phase');
                    floatingDemos.classList.remove('second-phase');
                }
            });
        });
    </script>
</body>
</html>
