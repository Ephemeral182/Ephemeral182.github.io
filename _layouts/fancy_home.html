<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 动态背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 25%, #0f0f23 50%, #000000 100%);
            z-index: -2;
        }
        
        /* 极光背景效果 */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.6;
            filter: blur(100px);
        }
        
        .aurora-bg::before,
        .aurora-bg::after {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: aurora-flow 25s infinite linear alternate;
        }
        
        .aurora-bg::before {
            background: radial-gradient(circle, rgba(66, 165, 245, 0.7) 0%, transparent 70%);
            top: -20%;
            left: -20%;
        }
        
        .aurora-bg::after {
            background: radial-gradient(circle, rgba(173, 216, 230, 0.6) 0%, transparent 70%);
            bottom: -20%;
            right: -20%;
            animation-delay: -12.5s;
            animation-direction: alternate-reverse;
        }
        
        @keyframes aurora-flow {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                transform: translate(100px, 50px) rotate(180deg) scale(1.2);
            }
        }
        
        /* 漂浮几何图形 */
        .geometric-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        
        .shape {
            position: absolute;
            border-radius: 20%;
            opacity: 0.15;
            animation: float-rotate 30s infinite linear alternate;
        }
        
        .shape-1 {
            width: 150px; height: 150px;
            background-color: #8ec5fc;
            top: 10%; left: 15%;
            animation-duration: 35s;
        }
        .shape-2 {
            width: 80px; height: 80px;
            background-color: #e0c3fc;
            top: 60%; left: 70%;
            animation-duration: 28s;
            animation-delay: -5s;
        }
        .shape-3 {
            width: 0; height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid #a8edea;
            background-color: transparent !important;
            border-radius: 0;
            top: 30%; left: 40%;
            animation-duration: 40s;
            animation-delay: -15s;
        }
        .shape-4 {
            width: 120px; height: 120px;
            background-color: #f0e68c;
            top: 75%; left: 10%;
            border-radius: 50%;
            animation-duration: 32s;
            animation-delay: -10s;
        }
        
        @keyframes float-rotate {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                transform: translateY(-40px) rotate(180deg) scale(1.1);
            }
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-menu a:hover::after {
            width: 100%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 80vh;
            gap: 4rem;
            margin-bottom: 4rem;
        }
        
        .hero-content {
            flex: 1;
        }
        
        .hero-image {
            flex: 0 0 400px;
            position: relative;
        }
        
        .profile-image {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .profile-image:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        
        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .hero-subtitle {
            font-size: 1.25rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .hero-description {
            font-size: 1.1rem;
            color: #d1d5db;
            margin-bottom: 3rem;
            line-height: 1.8;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        /* 信息卡片 */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 4rem 0;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }
        
        .info-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .card-content {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        /* 新闻滚动区域 */
        .news-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
        }
        
        .news-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .scrollable-news {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.02);
            list-style: none;
        }
        
        .scrollable-news li {
            margin-bottom: 8px;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.4;
            transition: all 0.3s ease;
        }
        
        .scrollable-news li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .scrollable-news li:last-child {
            border-bottom: none;
        }
        
        /* 滚动条样式 */
        .scrollable-news::-webkit-scrollbar {
            width: 8px;
        }
        
        .scrollable-news::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .scrollable-news::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }
        
        .scrollable-news::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 鼠标流光粒子样式 */
        .mouse-particle {
            pointer-events: none;
            position: fixed;
            border-radius: 50%;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }
        
        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
            }
            
            .hero-image {
                flex: none;
                max-width: 300px;
            }
            
            .info-cards {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
        
        /* 特殊强调文本 */
        .highlight {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }
        
        /* 链接样式 */
        a {
            color: #6366f1;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: #8b5cf6;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        
        /* 更柔和的突出自己名字的样式 - 稍微调暗版本 */
        .pub-authors strong u,
        strong u {
            color: #cbd5e1 !important;  /* 从 #e2e8f0 改为 #cbd5e1，稍微暗一点 */
            font-weight: 700 !important;
            text-decoration: underline !important;
            text-decoration-color: #64748b !important;
            text-decoration-thickness: 1.5px !important;
            text-underline-offset: 2px !important;
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.12), rgba(148, 163, 184, 0.12)) !important;  /* 从 0.15 改为 0.12，稍微淡一点 */
            padding: 2px 4px !important;
            border-radius: 4px !important;
            text-shadow: none !important;
            box-shadow: none !important;
            position: relative !important;
            display: inline-block !important;
        }
        
        /* 鼠标悬停时的柔和效果 */
        .pub-authors strong u:hover,
        strong u:hover {
            color: #e2e8f0 !important;  /* 悬停时稍微亮一点 */
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.2), rgba(148, 163, 184, 0.2)) !important;
            text-decoration-color: #475569 !important;
            transform: none !important;
            transition: all 0.3s ease !important;
        }
        
        /* 为了确保在所有地方都生效，添加更具体的选择器 */
        .publication-item .pub-authors strong u,
        .hero-content strong u,
        .card-content strong u {
            color: #cbd5e1 !important;  /* 从 #e2e8f0 改为 #cbd5e1 */
            font-weight: 700 !important;
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.12), rgba(148, 163, 184, 0.12)) !important;  /* 从 0.15 改为 0.12 */
            padding: 2px 4px !important;
            border-radius: 4px !important;
            text-shadow: none !important;
            text-decoration: underline !important;
            text-decoration-color: #64748b !important;
            text-decoration-thickness: 1.5px !important;
        }
        
        /* 精确调整下拉菜单定位 */
        .dropdown {
            position: relative;
        }
        
        .dropdown-toggle {
            cursor: pointer;
        }
        
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px); /* 在按钮下方10px处 */
            left: 50%; /* 从父元素中心开始 */
            transform: translateX(-50%) translateY(-10px); /* 水平居中，初始向上偏移 */
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.5rem 0;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1001;
            list-style: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0); /* 显示时保持水平居中 */
        }
        
        .dropdown-menu li {
            margin: 0;
        }
        
        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1.5rem;
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 0 0.5rem;
            white-space: nowrap;
        }
        
        .dropdown-menu a:hover {
            color: #ffffff;
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(5px);
        }
        
        .dropdown-menu a::after {
            display: none;
        }
        
        /* 下拉箭头指示器 */
        .dropdown-toggle::after {
            content: '▼';
            font-size: 0.7em;
            margin-left: 0.5rem;
            transition: transform 0.3s ease;
        }
        
        .dropdown:hover .dropdown-toggle::after {
            transform: rotate(180deg);
        }
        
        /* 响应式设计 - 移动端保持垂直布局 */
        @media (max-width: 768px) {
            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 0;
                margin: 0;
                display: block; /* 移动端恢复垂直布局 */
                min-width: auto;
            }
            
            .dropdown-menu a {
                padding: 0.5rem 0;
                border-radius: 0;
            }
        }
        
        /* 社交媒体链接样式 */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            transform: translateY(-3px);
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        
        .social-link i {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }
        
        .social-link:hover i {
            transform: scale(1.2) rotate(5deg);
        }
        
        /* 打字机效果 */
        .typewriter {
            overflow: hidden;
            border-right: 3px solid #6366f1;
            white-space: nowrap;
            animation: typewriter 3s steps(8) 1s both, blink 1s step-end infinite;
        }
        
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink {
            50% { border-color: transparent; }
        }
        
        /* 统计数字区域 */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin: 4rem 0;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
            position: relative;
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #a1a1aa;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        /* 技能标签云 */
        .skills-section {
            margin: 4rem 0;
            text-align: center;
        }
        
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .skills-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        
        .skill-tag {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: #d1d5db;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }
        
        .skill-tag[data-weight="5"] {
            font-size: 1.2rem;
            padding: 0.75rem 1.5rem;
            animation-delay: 0s;
        }
        
        .skill-tag[data-weight="4"] {
            font-size: 1.1rem;
            animation-delay: -1s;
        }
        
        .skill-tag[data-weight="3"] {
            font-size: 1rem;
            animation-delay: -2s;
        }
        
        .skill-tag[data-weight="2"] {
            font-size: 0.9rem;
            animation-delay: -3s;
        }
        
        .skill-tag[data-weight="1"] {
            font-size: 0.8rem;
            animation-delay: -4s;
        }
        
        .skill-tag:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* 3D卡片翻转效果 */
        .card-3d {
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        
        .card-3d:hover .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 2rem;
        }
        
        .card-back {
            background: rgba(99, 102, 241, 0.1);
            transform: rotateY(180deg);
        }
        
        /* 头像发光效果 */
        .hero-image {
            position: relative;
        }
        
        .image-glow {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6, #06b6d4);
            border-radius: 25px;
            z-index: -1;
            opacity: 0;
            filter: blur(20px);
            transition: opacity 0.3s ease;
        }
        
        .profile-image:hover + .image-glow {
            opacity: 0.7;
        }
        
        /* 新的淡入动画 */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        
        /* FontAwesome图标支持 */
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css');
    </style>
</head>
<body>
    <!-- 背景效果 -->
    <div class="bg-gradient"></div>
    <div class="aurora-bg"></div>
    <div class="geometric-bg">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">Sixiang Chen</a>
            <ul class="nav-menu">
                <li><a href="/">Story of Me</a></li>
                <li><a href="/file/resume_of_myself3.pdf">Resume</a></li>
                <li><a href="/publications/">Publications</a></li>
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Paper Web</a>
                    <ul class="dropdown-menu">
                        <li><a href="/PosterCraft/">PosterCraft</a></li>
                        <li><a href="/T3-DiffWeather/">T3-DiffWeather</a></li>
                        <li><a href="/UDR_S2Former_deraining/">UDR-S2Former</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- 主要内容 -->
    <main class="main-content">
        {{ content }}
    </main>
    
    <!-- JavaScript -->
    <script>
        // 鼠标流光特效
        document.addEventListener('DOMContentLoaded', function() {
            function createParticle(x, y, size) {
                const particle = document.createElement('div');
                particle.className = 'mouse-particle';
                
                const actualSize = size * (0.5 + Math.random() * 0.5);
                particle.style.width = actualSize + 'px';
                particle.style.height = actualSize + 'px';
                
                const hue = Math.floor(Math.random() * 360);
                particle.style.background = `hsla(${hue}, 80%, 60%, 0.25)`;
                particle.style.boxShadow = `0 0 10px hsla(${hue}, 80%, 50%, 0.3)`;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.style.opacity = '0';
                    particle.style.transform = 'translate(-50%, -50%) scale(0.5)';
                    particle.style.transition = 'all 0.6s ease-out';
                    
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 600);
                }, 10);
            }
            
            let lastX = 0;
            let lastY = 0;
            let throttle = false;
            
            document.addEventListener('mousemove', function(e) {
                if (throttle) return;
                throttle = true;
                
                setTimeout(() => {
                    throttle = false;
                }, 10);
                
                const x = e.clientX;
                const y = e.clientY;
                
                const speed = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
                const size = Math.min(16, Math.max(5, speed * 0.4));
                
                createParticle(x, y, size);
                
                lastX = x;
                lastY = y;
            });
        });
        
        // 滚动动画
        function handleScrollAnimation() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            handleScrollAnimation();
            window.addEventListener('scroll', handleScrollAnimation);
        });
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 0.02;
                const x = e.clientX * speed;
                const y = e.clientY * speed;
                
                shape.style.transform += ` translate(${x}px, ${y}px)`;
            });
        });
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        
        // 数字滚动动画
        function animateNumbers() {
            const numbers = document.querySelectorAll('.stat-number');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = parseInt(entry.target.dataset.target);
                        let current = 0;
                        const increment = target / 100;
                        
                        const timer = setInterval(() => {
                            current += increment;
                            entry.target.textContent = Math.floor(current);
                            
                            if (current >= target) {
                                entry.target.textContent = target;
                                clearInterval(timer);
                            }
                        }, 20);
                        
                        observer.unobserve(entry.target);
                    }
                });
            });
            
            numbers.forEach(number => observer.observe(number));
        }
        
        // 技能标签随机浮动
        function animateSkills() {
            const skills = document.querySelectorAll('.skill-tag');
            
            skills.forEach((skill, index) => {
                const randomDelay = Math.random() * 2;
                const randomDuration = 3 + Math.random() * 2;
                
                skill.style.animationDelay = randomDelay + 's';
                skill.style.animationDuration = randomDuration + 's';
            });
        }
        
        // 初始化新功能
        document.addEventListener('DOMContentLoaded', function() {
            animateNumbers();
            animateSkills();
        });
    </script>
</body>
</html>
