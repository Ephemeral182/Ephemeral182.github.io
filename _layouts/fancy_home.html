<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts: Newsreader (serif headlines), Inter (body sans), JetBrains Mono (meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Paper-tone base */
            --paper:    #fbfaf6;
            --paper-2:  #f3f1ea;
            --rule:     #e2dfd6;
            --rule-2:   #ece9df;

            /* Ink scale (warm cool dark) */
            --ink:      #15141a;
            --ink-2:    #2a2830;
            --ink-3:    #5e5b66;
            --ink-4:    #8f8b96;

            /* Brand: violet primary + signature deep-rose accent */
            --c-violet: #5b5cf0;
            --c-violet-2: #7c5cf0;
            --accent:   #b91c4d;        /* signature deep rose, used for §, &, type tags */
            --accent-hover: #8e1037;
            --accent-soft:  rgba(185, 28, 77, 0.08);

            /* Research card hues — desaturated */
            --card-violet: #6366f1;
            --card-rose:   #b91c4d;
            --card-cyan:   #0e8a9a;
            --card-amber:  #b8770a;

            /* Fonts */
            --font-serif: 'Newsreader', 'Iowan Old Style', 'Georgia', serif;
            --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --font-mono:  'JetBrains Mono', ui-monospace, Menlo, monospace;

            /* Layout */
            --c-line:  var(--rule);
            --c-glass: rgba(255, 255, 255, 0.7);
            --c-ink-2: var(--ink-2);
            --c-mute:  var(--ink-3);
        }

        body {
            font-family: var(--font-sans);
            color: var(--ink);
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
            background-color: var(--paper);
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        /* Subtle paper grain (very low contrast) */
        body::before {
            background-image:
                radial-gradient(rgba(60, 50, 30, 0.025) 1px, transparent 1px);
            background-size: 5px 5px;
            background-position: 0 0;
        }

        /* Soft brand glow at top-left only — not the whole page */
        body::after {
            background:
                radial-gradient(720px 460px at 8% -8%, rgba(91, 92, 240, 0.10), transparent 60%),
                radial-gradient(560px 360px at 100% 0%, rgba(185, 28, 77, 0.05), transparent 65%);
            z-index: -1;
        }

        ::selection { background: var(--accent); color: #fff; }
        
        /* 导航栏 — 杂志风：米白底 + 衬线 logo + hairline 分隔 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(251, 250, 246, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--rule);
            z-index: 1000;
            padding: 0.7rem 0;
            transition: all 0.25s ease;
        }

        .navbar.scrolled {
            background: rgba(251, 250, 246, 0.98);
            box-shadow: 0 1px 0 var(--rule), 0 8px 24px -16px rgba(15, 14, 26, 0.1);
        }

        .nav-container {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(20px, 4vw, 56px);
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--ink);
            letter-spacing: -0.015em;
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo em {
            font-style: italic;
            color: var(--accent);
            font-weight: 400;
        }
        .logo:hover { color: var(--accent); }

        .nav-menu {
            display: flex;
            gap: 4px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            font-family: var(--font-serif);
            color: var(--ink-2);
            text-decoration: none;
            font-weight: 400;
            font-size: 1rem;
            letter-spacing: -0.005em;
            transition: color 0.15s ease;
            position: relative;
            padding: 0.5rem 0.75rem;
            border-radius: 0;
        }

        .nav-menu a:hover {
            color: var(--accent);
            background: transparent;
        }

        .nav-menu a::after { display: none; }
        
        /* 主要内容 */
        .main-content {
            margin-top: 64px;
            padding: clamp(20px, 4vw, 56px);
            max-width: 1180px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Hero区域 */
        .hero {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: clamp(32px, 5vw, 72px);
            align-items: start;
            padding: clamp(48px, 7vw, 88px) 0 clamp(40px, 6vw, 72px);
            border-bottom: 1px solid var(--rule);
            margin-bottom: 0;
        }

        @media (max-width: 860px) {
            .hero { grid-template-columns: 1fr; }
        }

        .hero-content {
            position: relative;
            min-width: 0;
        }
        
        /* ====== Hero 右栏 — 杂志拼版（肖像 + dossier 实习卡） ====== */
        .hero-image {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 肖像本体 */
        .profile-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background: var(--paper-2);
            overflow: visible;
            border-radius: 3px;
            transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
        }
        .profile-frame::before {
            /* 后置色块层 — 制造杂志拼贴感 */
            content: '';
            position: absolute;
            inset: 14px -14px -14px 14px;
            background: linear-gradient(135deg, var(--accent-soft), rgba(91, 92, 240, 0.08));
            border-radius: 3px;
            z-index: -1;
            transition: inset 0.5s cubic-bezier(.2,.8,.2,1);
        }
        .profile-frame::after {
            /* 边框线（hairline） */
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid var(--rule);
            border-radius: 3px;
            box-shadow: 0 24px 48px -28px rgba(20, 15, 10, 0.28);
            pointer-events: none;
        }
        .profile-frame:hover { transform: translate(-3px, -3px); }
        .profile-frame:hover::before { inset: 18px -18px -18px 18px; }

        .profile-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
            filter: saturate(0.96) contrast(1.02);
            position: relative;
            z-index: 1;
        }

        /* 肖像角标 — 像照片上的胶带签 */
        .profile-tape {
            position: absolute;
            top: -10px;
            right: 18px;
            z-index: 2;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #fff;
            background: var(--ink);
            padding: 4px 10px;
            border-radius: 2px;
            box-shadow: 0 4px 12px -6px rgba(15, 14, 26, 0.4);
            transform: rotate(2deg);
        }

        .profile-glow { display: none; }

        .avatar-caption {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            color: var(--ink-4);
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            padding: 0 2px;
        }

        /* Quick Facts — 右栏小名片，让 hero 右栏更饱满 */
        .quick-facts {
            margin-top: 4px;
            padding: 14px 14px 10px;
            border: 1px solid var(--rule);
            border-radius: 3px;
            background: var(--paper);
            position: relative;
            box-shadow: 0 1px 0 var(--rule-2);
        }
        .quick-facts::before {
            content: '';
            position: absolute;
            top: -1px; left: 14px;
            width: 28px;
            height: 2px;
            background: var(--accent);
        }
        .qf-row {
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--rule-2);
            align-items: baseline;
        }
        .qf-row:last-child { border-bottom: none; padding-bottom: 0; }
        .qf-key {
            font-family: var(--font-mono);
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-4);
        }
        .qf-val {
            font-family: var(--font-serif);
            font-size: 13.5px;
            color: var(--ink-2);
            line-height: 1.35;
            min-width: 0;
            word-break: break-word;
        }
        .qf-val a {
            color: var(--ink);
            border-bottom: 1px solid var(--accent);
            padding: 0 1px;
            transition: background 0.15s, color 0.15s;
        }
        .qf-val a:hover {
            background: var(--accent);
            color: #fff;
        }

        /* hero-role pill-live: 当前实习的活动小灯 */
        .hero-role .pill-live {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: rgba(185, 28, 77, 0.25);
        }
        .hero-role .pill-live i {
            font-size: 7px;
            color: var(--accent);
            animation: industryPulse 2.2s ease-in-out infinite;
            border-radius: 50%;
        }
        @keyframes industryPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(185, 28, 77, 0.18); }
            50%      { box-shadow: 0 0 0 6px rgba(185, 28, 77, 0.04); }
        }

        /* ====== § Industry Experience section ====== */
        .sec-lede {
            font-family: var(--font-serif);
            font-size: 17px;
            color: var(--ink-3);
            margin: -16px 0 32px;
            max-width: 720px;
            line-height: 1.55;
            letter-spacing: -0.003em;
        }

        /* ===== Industry cards — 杂志双开页风 ===== */
        .industry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }
        @media (max-width: 860px) {
            .industry-grid { grid-template-columns: 1fr; gap: 18px; }
        }

        .industry-card {
            position: relative;
            padding: 22px 24px 22px;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 4px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100%;
        }
        .industry-card::before {
            /* 左侧细 accent 条 */
            content: '';
            position: absolute;
            top: 22px; bottom: 22px; left: -1px;
            width: 3px;
            background: var(--rule);
            border-radius: 0;
            transition: background 0.25s ease;
        }
        .industry-card.is-now {
            background: linear-gradient(180deg, var(--paper), var(--paper-2));
            border-color: rgba(185, 28, 77, 0.22);
            box-shadow: 0 1px 0 var(--rule), 0 24px 48px -32px rgba(185, 28, 77, 0.18);
        }
        .industry-card.is-now::before {
            background: var(--accent);
        }
        .industry-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 1px 0 var(--rule), 0 28px 56px -32px rgba(15, 14, 26, 0.22);
        }
        .industry-card.is-now:hover {
            box-shadow: 0 1px 0 var(--rule), 0 28px 56px -32px rgba(185, 28, 77, 0.32);
        }

        .industry-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--rule-2);
        }
        .industry-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .industry-status-past {
            color: var(--ink-4);
        }
        .industry-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(185, 28, 77, 0.18);
            animation: industryPulse 2.2s ease-in-out infinite;
        }
        .industry-date {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-3);
            font-weight: 500;
        }

        .industry-card-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }
        .industry-card-title {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .industry-company {
            font-family: var(--font-serif);
            font-size: clamp(1.35rem, 2vw, 1.7rem);
            font-weight: 500;
            color: var(--ink);
            line-height: 1.15;
            letter-spacing: -0.02em;
        }
        .industry-sub {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.7em;
            font-weight: 400;
            color: var(--ink-3);
            margin-left: 4px;
            letter-spacing: 0;
        }
        .industry-program {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .industry-card.is-now .industry-program {
            color: var(--accent);
        }
        .industry-card:not(.is-now) .industry-program {
            color: var(--ink-3);
        }

        .industry-role {
            font-family: var(--font-sans);
            font-size: 13.5px;
            font-weight: 500;
            color: var(--ink-2);
            margin: 0;
            line-height: 1.45;
        }

        .industry-desc {
            font-family: var(--font-serif);
            font-size: 15.5px;
            color: var(--ink-2);
            line-height: 1.6;
            margin: 0;
            letter-spacing: -0.003em;
        }
        .industry-desc strong {
            color: var(--ink);
            font-weight: 600;
        }
        .industry-desc a {
            color: var(--ink);
            border-bottom: 1px solid var(--accent);
            padding: 0 1px;
            transition: background 0.15s, color 0.15s;
        }
        .industry-desc a:hover {
            background: var(--accent);
            color: #fff;
        }

        .industry-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }
        .industry-tags .tag {
            display: inline-flex;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-3);
            padding: 4px 9px;
            border: 1px solid var(--rule);
            border-radius: 3px;
            background: transparent;
            transition: all 0.18s ease;
        }
        .industry-card:hover .industry-tags .tag {
            border-color: var(--ink-4);
        }
        .industry-card.is-now .industry-tags .tag {
            color: var(--accent);
            border-color: rgba(185, 28, 77, 0.28);
            background: var(--accent-soft);
        }
        .industry-card.is-now .industry-tags .tag:hover {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        /* eyebrow — 期刊编号风 "§ Homepage — Hong Kong · 2026" */
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            margin: 0 0 22px;
        }
        .hero-eyebrow::before {
            content: '';
            width: 28px;
            height: 1px;
            background: var(--accent);
        }
        .eyebrow-dot { display: none; }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 6vw, 4.6rem);
            font-weight: 400;
            margin: 0 0 10px;
            color: var(--ink);
            letter-spacing: -0.025em;
            line-height: 1.02;
        }
        .hero-title .amp {
            font-style: italic;
            color: var(--accent);
            font-weight: 400;
        }
        .hero-title-zh {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            font-size: 0.55em;
            color: var(--ink-3);
            margin-left: 0.3em;
            letter-spacing: 0;
            vertical-align: 0.04em;
        }

        .hero-role {
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            color: var(--ink-3);
            margin: 0 0 26px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--rule);
            max-width: 640px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hero-role .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 9px;
            border: 1px solid var(--rule);
            border-radius: 3px;
            color: var(--accent);
            background: var(--paper);
        }
        .hero-role .pill i { font-size: 9px; }
        .hero-role .role-sep {
            color: var(--ink-4);
            margin: 0 4px;
        }

        .hero-description {
            font-family: var(--font-serif);
            font-size: clamp(16.5px, 1.25vw, 18.5px);
            color: var(--ink-2);
            margin: 0 0 28px;
            line-height: 1.62;
            max-width: 640px;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            font-weight: 400;
            letter-spacing: -0.003em;
        }
        .hero-description strong { font-weight: 600; color: var(--ink); }
        .hero-description a {
            color: var(--ink);
            border-bottom: 1px solid var(--accent);
            padding: 0 1px;
            transition: background 0.15s, color 0.15s;
        }
        .hero-description a:hover {
            background: var(--accent);
            color: #fff;
        }

        /* CTA buttons */
        .cta-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 11px 16px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            border-radius: 3px;
            transition: all 0.18s ease;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            min-width: 168px;
        }
        .btn .arrow {
            font-family: var(--font-mono);
            font-size: 13px;
            transition: transform 0.18s;
        }
        .btn:hover .arrow { transform: translateX(3px); }
        .btn-primary {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }
        .btn-primary:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            color: var(--ink);
            border-color: var(--rule);
        }
        .btn-outline:hover {
            border-color: var(--ink);
            background: var(--paper-2);
        }
        
        /* 社交链接 — 杂志 dock 风：等宽细栏，细分割线 */
        .social-links {
            display: flex;
            margin-top: 4px;
            border-top: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
        }

        .social-link {
            flex: 1 1 0;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            padding: 0 6px;
            background: transparent;
            border: none;
            border-right: 1px solid var(--rule-2);
            color: var(--ink-3);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s ease, background 0.15s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        .social-link:last-child { border-right: none; }

        .social-link i { font-size: 13px; }

        .social-text {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .social-link::before { display: none; }

        .social-link:hover {
            color: var(--accent);
            background: var(--paper-2);
            transform: none;
        }

        @media (max-width: 768px) {
            .social-link { padding: 0 4px; }
            .social-text { font-size: 9.5px; }
        }
        
        /* ====== 杂志式 Section 容器 ====== */
        section.journal {
            padding: clamp(48px, 7vw, 88px) 0;
            border-bottom: 1px solid var(--rule);
            position: relative;
        }
        section.journal:last-of-type { border-bottom: none; }

        .idx {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 22px;
        }
        .idx::before {
            content: '';
            width: 28px;
            height: 1px;
            background: var(--accent);
            display: inline-block;
        }

        .sec-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2rem, 3.4vw, 2.7rem);
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin: 0 0 36px;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .sec-title em {
            font-style: italic;
            color: var(--accent);
            font-weight: 400;
        }
        .sec-sub {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-3);
            margin-top: 4px;
        }

        /* ===== News — 杂志 log 三栏 grid ===== */
        .news-section {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: visible;
            transform: none;
            opacity: 1;
            transition: none;
        }
        .news-section::before { display: none; }

        .news-title { display: none; }  /* 由 .sec-title 提供 */

        .scrollable-news {
            max-height: 460px;
            overflow-y: auto;
            border-radius: 0;
            padding: 0 4px 0 0;
            background: transparent;
        }

        .scrollable-news ul {
            list-style: none;
            position: relative;
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--rule);
        }
        .scrollable-news ul::before { display: none; }

        .scrollable-news li {
            position: relative;
            margin: 0;
            padding: 12px 8px 12px 0;
            border-bottom: 1px solid var(--rule-2);
            border-radius: 0;
            display: grid;
            grid-template-columns: 96px 84px 1fr;
            gap: 18px;
            align-items: baseline;
            line-height: 1.55;
            color: var(--ink-2);
            transition: background 0.15s ease;
        }
        .scrollable-news li::before { display: none; }
        .scrollable-news li:hover {
            background: var(--paper-2);
            transform: none;
        }

        .scrollable-news li .date {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--ink-3);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .scrollable-news li .glyph {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-4);
            white-space: nowrap;
        }
        .scrollable-news li .glyph.g-paper   { color: var(--accent); }
        .scrollable-news li .glyph.g-release { color: var(--c-violet); }
        .scrollable-news li .glyph.g-talk    { color: #0e8a9a; }
        .scrollable-news li .glyph.g-role    { color: #b8770a; }
        .scrollable-news li .glyph.g-event   { color: var(--ink-2); }
        .scrollable-news li .glyph.g-press   { color: var(--accent); }

        .scrollable-news li .body {
            font-family: var(--font-serif);
            font-size: 16px;
            color: var(--ink-2);
            line-height: 1.55;
        }
        .scrollable-news li .body strong {
            color: var(--ink);
            font-weight: 600;
        }
        .scrollable-news li .body a {
            color: var(--ink);
            border-bottom: 1px solid var(--accent);
            padding: 0 1px;
            transition: background 0.15s, color 0.15s;
        }
        .scrollable-news li .body a:hover {
            background: var(--accent);
            color: #fff;
        }

        @media (max-width: 720px) {
            .scrollable-news li {
                grid-template-columns: 80px 70px 1fr;
                gap: 10px;
            }
            .scrollable-news li .body { font-size: 15px; }
        }

        /* 滚动条 */
        .scrollable-news::-webkit-scrollbar { width: 6px; }
        .scrollable-news::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-news::-webkit-scrollbar-thumb {
            background: var(--rule);
            border-radius: 0;
        }
        .scrollable-news::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
        
        /* (鼠标粒子特效已移除——保持杂志静态调性) */
        
        /* 增强的动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .slide-in-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.8s ease;
        }
        
        .slide-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .slide-in-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s ease;
        }
        
        .slide-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* 响应式设计 */
        @media (max-width: 860px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 32px;
                text-align: left;
                padding-top: clamp(28px, 6vw, 56px);
            }
            .hero-image {
                max-width: 280px;
                margin-top: 8px;
            }
            .hero-role {
                gap: 6px;
            }
        }
        @media (max-width: 720px) {
            .nav-menu {
                gap: 0;
            }
            .nav-menu a {
                padding: 6px 8px;
                font-size: 14px;
            }
            .main-content {
                padding: 16px;
            }
            .cta-stack .btn { min-width: 0; flex: 1 1 140px; }
        }
        
        /* 特殊强调文本 */
        .highlight {
            color: var(--accent);
            font-style: italic;
            font-weight: 500;
            background: none;
            -webkit-text-fill-color: var(--accent);
        }

        /* 链接样式 */
        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease, background 0.15s ease;
        }

        a:hover { color: var(--accent); }
        
        /* 突出自己名字 (e.g. <strong><u>Sixiang Chen</u></strong>) — 米白杂志风 */
        .pub-authors strong u,
        strong u {
            color: var(--ink) !important;
            font-weight: 700 !important;
            text-decoration: none !important;
            background: transparent !important;
            padding: 0 1px !important;
            border-radius: 0 !important;
            text-shadow: none !important;

        .pub-authors strong u:hover,
        strong u:hover {
            color: #fff !important;
            background: var(--accent) !important;
            border-bottom-color: var(--accent) !important;
        }
        
        /* 下拉菜单 — 米白杂志风 */
        .dropdown { position: relative; }
        .dropdown-toggle { cursor: pointer; }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: var(--paper);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--rule);
            border-radius: 3px;
            padding: 4px 0;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 1001;
            list-style: none;
            box-shadow: 0 1px 0 var(--rule), 0 12px 28px -16px rgba(15, 14, 26, 0.18);
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .dropdown-menu li { margin: 0; }

        .dropdown-menu a {
            display: block;
            padding: 8px 16px;
            font-family: var(--font-serif);
            color: var(--ink-2);
            text-decoration: none;
            font-weight: 400;
            font-size: 15px;
            letter-spacing: -0.005em;
            transition: color 0.15s, background 0.15s;
            border-radius: 0;
            margin: 0;
            white-space: nowrap;
        }

        .dropdown-menu a:hover {
            color: var(--accent);
            background: var(--paper-2);
            transform: none;
        }

        .dropdown-menu a::after { display: none; }

        /* 下拉箭头指示器 */
        .dropdown-toggle::after {
            content: '▾';
            font-family: var(--font-mono);
            font-size: 0.85em;
            margin-left: 6px;
            color: var(--ink-4);
            transition: transform 0.2s ease, color 0.2s ease;
            display: inline-block;
        }

        .dropdown:hover .dropdown-toggle::after {
            transform: rotate(180deg);
            color: var(--accent);
        }
        
        /* 响应式设计 - 移动端保持垂直布局 */
        @media (max-width: 768px) {
            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 0;
                margin: 0;
                display: block;
                min-width: auto;
            }
            
            .dropdown-menu a {
                padding: 0.5rem 0;
                border-radius: 0;
            }
        }
        
        /* ====== Awards — 杂志风：日期-成就 grid ====== */
        .awards-list {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid var(--rule);
        }

        .award-item {
            display: grid;
            grid-template-columns: 24px 1fr;
            align-items: baseline;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--rule-2);
            border-radius: 0;
            transition: background 0.15s ease;
        }
        .award-item:hover {
            transform: none;
            background: var(--paper-2);
        }

        .award-icon {
            color: var(--accent);
            font-size: 11px;
            margin-top: 0;
            flex-shrink: 0;
            font-family: var(--font-mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
        }
        .award-icon::before { content: '★'; }

        .award-content { flex: 1; }

        .award-title {
            font-family: var(--font-serif);
            font-weight: 500;
            font-size: 16px;
            color: var(--ink);
            line-height: 1.5;
        }
        .award-title a {
            color: var(--ink);
            border-bottom: 1px solid var(--accent);
            padding: 0 1px;
            transition: background 0.15s, color 0.15s;
        }
        .award-title a:hover {
            background: var(--accent);
            color: #fff;
        }

        .award-desc {
            font-family: var(--font-mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-4);
            margin-top: 4px;
        }

        /* Service list — 紧凑双栏 */
        .service-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0 32px;
            border-top: 1px solid var(--rule);
        }
        @media (max-width: 720px) { .service-list { grid-template-columns: 1fr; } }

        .service-list p {
            margin: 0;
            padding: 9px 0;
            border-bottom: 1px solid var(--rule-2);
            position: relative;
            transition: background 0.15s ease;
            border-radius: 0;
            line-height: 1.5;
            font-family: var(--font-serif);
            font-size: 15.5px;
            color: var(--ink-2);
            padding-left: 0;
        }
        .service-list p:hover {
            transform: none;
            color: var(--ink);
            background: var(--paper-2);
        }
        .service-list p::before { display: none; }
        .service-list p strong {
            font-weight: 600;
            color: var(--ink);
        }

        .subhead {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-3);
            margin: 0 0 14px;
        }
        .subhead.is-secondary { margin-top: 36px; }

        /* Experience section — 杂志 log 风 */
        .experience-section, .service-section {
            margin: 0;
        }

        .experience-header, .service-header {
            display: none; /* 由 .idx + .sec-title 统一处理 */
        }

        .experience-title, .service-title {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2rem, 3.4vw, 2.7rem);
            letter-spacing: -0.02em;
            color: var(--ink);
            margin: 0;
        }

        .experience-card, .service-card {
            background: transparent;
            border-radius: 0;
            padding: 0;
            color: var(--ink-2);
            box-shadow: none;
            border: none;
            position: relative;
            overflow: visible;
            transition: none;
        }
        .experience-card:hover, .service-card:hover {
            transform: none;
            box-shadow: none;
            background: transparent;
        }
        .experience-card::before, .service-card::before { display: none; }

        .experience-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--rule);
        }

        .experience-list li {
            position: relative;
            padding: 14px 0;
            margin-bottom: 0;
            line-height: 1.55;
            font-family: var(--font-serif);
            font-size: 17px;
            color: var(--ink-2);
            border-bottom: 1px solid var(--rule-2);
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 24px;
            align-items: baseline;
            transition: background 0.15s ease;
        }

        .experience-list li:last-child { margin-bottom: 0; }
        .experience-list li::before { display: none; }
        .experience-list li:hover {
            transform: none;
            color: var(--ink-2);
            background: var(--paper-2);
        }
        .experience-list li strong {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-3);
            font-weight: 500;
        }

        @media (max-width: 720px) {
            .experience-list li {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }

        /* ===== Research Interests — 杂志卡片 ===== */
        .research-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px 36px;
        }

        .research-card {
            position: relative;
            padding: 22px 0 0;
            background: transparent;
            border: none;
            border-top: 1px solid var(--rule);
            border-radius: 0;
            box-shadow: none;
            transition: none;
            overflow: visible;
            backdrop-filter: none;
        }

        .research-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 0;
            width: 56px;
            height: 2px;
            background: var(--card-accent, var(--c-violet));
        }
        .research-card::after { display: none; }

        .research-card:hover { transform: none; }

        .research-card[data-color="violet"] { --card-accent: var(--card-violet); }
        .research-card[data-color="rose"]   { --card-accent: var(--card-rose); }
        .research-card[data-color="cyan"]   { --card-accent: var(--card-cyan); }
        .research-card[data-color="amber"]  { --card-accent: var(--card-amber); }

        .research-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            border-radius: 0;
            background: transparent;
            color: var(--card-accent, var(--c-violet));
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
            box-shadow: none;
            gap: 8px;
        }
        .research-icon i { font-size: 12px; }
        .research-icon::after {
            content: attr(data-label);
        }

        .research-card-title {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 500;
            color: var(--ink);
            margin: 0 0 10px;
            letter-spacing: -0.015em;
            line-height: 1.2;
        }

        .research-card-desc {
            font-family: var(--font-serif);
            font-size: 16px;
            color: var(--ink-2);
            line-height: 1.6;
            margin: 0 0 14px;
            letter-spacing: -0.003em;
        }

        .research-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .research-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-3);
            background: transparent;
            border: 1px solid var(--rule);
            padding: 3px 8px;
            border-radius: 3px;
            transition: all 0.18s ease;
        }
        .research-tags .tag em {
            font-style: normal;
            font-weight: 600;
            color: var(--card-accent, var(--c-violet));
            font-size: 0.95em;
        }
        .research-tags .tag:hover {
            color: var(--ink);
            border-color: var(--ink-4);
            transform: none;
        }

        @media (max-width: 768px) {
            .research-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* 移除原有的逐字动画样式，替换为Typed.js样式 */
        .typing-text-container {
            margin: 0.5rem 0 1.5rem 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* Typed.js 打字机效果样式 - 更新为更优雅的字体 */
        .typed-motto {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(1.05rem, 1.3vw, 1.2rem);
            margin: 0;
            min-height: 32px;
            color: var(--accent);
            font-weight: 400;
            text-align: left;
            letter-spacing: 0.005em;
            line-height: 1.4;
        }
        .typing-text-container {
            margin: 0 0 22px !important;
            height: auto !important;
            min-height: 32px;
        }

        .typed-cursor {
            color: var(--accent) !important;
            font-weight: 500;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化Typed.js打字机效果
            if (typeof Typed !== 'undefined') {
                new Typed('#motto', {
                    strings: [
                        "LOSING GROUND NOW, GAINING MILES TOMORROW",
                        "Flowing water does not vie to be first; its contest is to flow on unceasingly."
                    ],
                    typeSpeed: 45,        /* 从60调整到45，速度更快 */
                    backSpeed: 35,        /* 从40调整到35，删除速度也稍快 */
                    loop: true,
                    startDelay: 2000,
                    backDelay: 3000,
                    showCursor: true,
                    cursorChar: '|'
                });
            } else {
                // 动态加载Typed.js库
                var script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/typed.js@2.0.12';
                script.onload = function() {
                    new Typed('#motto', {
                        strings: [
                            "Losing Ground Now, Gaining Miles Tomorrow!",
                        ],
                        typeSpeed: 45,    /* 从60调整到45 */
                        backSpeed: 35,    /* 从40调整到35 */
                        loop: true,
                        startDelay: 2000,
                        backDelay: 3000,
                        showCursor: true,
                        cursorChar: '|'
                    });
                };
                document.head.appendChild(script);
            }
            
            // 滚动动画
            function handleScrollAnimation() {
                const elements = document.querySelectorAll('.fade-in, .slide-in-left, .slide-in-right, .info-card, .news-section');
                elements.forEach((element, index) => {
                    const elementTop = element.getBoundingClientRect().top;
                    const elementVisible = 100;
                    
                    if (elementTop < window.innerHeight - elementVisible) {
                        setTimeout(() => {
                            element.classList.add('visible');
                        }, index * 150);
                    }
                });
            }
            
            // 导航栏滚动效果
            function handleNavbarScroll() {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }
            
            handleScrollAnimation();
            handleNavbarScroll();
            
            window.addEventListener('scroll', () => {
                handleScrollAnimation();
                handleNavbarScroll();
            });
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
