<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts - 添加更多优雅字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --c-violet: #6366f1;
            --c-violet-2: #8b5cf6;
            --c-cyan: #06b6d4;
            --c-amber: #f59e0b;
            --c-rose: #ec4899;
            --c-ink: #0f172a;
            --c-ink-2: #334155;
            --c-mute: #64748b;
            --c-line: rgba(15, 23, 42, 0.08);
            --c-glass: rgba(255, 255, 255, 0.78);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--c-ink);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            background-color: #f6f7fb;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        /* 柔和的多层渐变背景，替代之前抢戏的风景图 */
        body::before {
            background:
                radial-gradient(900px 600px at 12% -10%, rgba(99, 102, 241, 0.18), transparent 60%),
                radial-gradient(700px 500px at 100% 10%, rgba(236, 72, 153, 0.12), transparent 60%),
                radial-gradient(900px 700px at 50% 110%, rgba(6, 182, 212, 0.14), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        /* 极淡网格点缀，增加质感 */
        body::after {
            background-image:
                radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.06) 1px, transparent 0);
            background-size: 28px 28px;
            opacity: 0.45;
            z-index: -1;
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            z-index: 1000;
            padding: 1rem 0;
            transition: all 0.3s ease;
        }
        
        .navbar.scrolled {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.15);
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #1f2937;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .nav-menu a:hover {
            color: #0f172a;
            background: rgba(99, 102, 241, 0.15);
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        
        .nav-menu a:hover::after {
            width: 80%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 80vh;
            gap: 4rem;
            margin-bottom: 4rem;
        }
        
        .hero-content {
            flex: 1;
            position: relative;
        }
        
        .hero-image {
            flex: 0 0 360px;
            position: relative;
        }

        .profile-frame {
            position: relative;
            border-radius: 28px;
            padding: 8px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.45), rgba(236, 72, 153, 0.35) 50%, rgba(6, 182, 212, 0.4));
            box-shadow: 0 30px 60px -20px rgba(99, 102, 241, 0.35), 0 10px 30px -15px rgba(15, 23, 42, 0.2);
            transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
        }

        .profile-frame:hover {
            transform: translateY(-8px);
        }

        .profile-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 22px;
            transition: all 0.5s ease;
            filter: saturate(1.02);
        }

        .profile-glow {
            position: absolute;
            inset: -20px;
            border-radius: 36px;
            background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.35), transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.28), transparent 60%);
            filter: blur(40px);
            z-index: -1;
            opacity: 0.7;
        }

        /* 小标签 eyebrow */
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--c-violet);
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            margin-bottom: 1.25rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .eyebrow-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c-violet);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18); }
            50% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.05); }
        }

        .hero-title {
            font-size: clamp(2.6rem, 5.2vw, 4.2rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--c-ink);
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            letter-spacing: -0.025em;
            line-height: 1.05;
        }
        .hero-title-zh {
            font-weight: 600;
            font-size: 0.65em;
            color: var(--c-mute);
            margin-left: 0.4em;
            letter-spacing: 0;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--c-ink-2);
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* affiliation 小徽章 */
        .hero-affiliation {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 1rem 0 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        .affil-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--c-ink-2);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--c-line);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .affil-tag i { color: var(--c-violet); font-size: 0.9em; }
        .affil-tag:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.12);
        }

        .hero-description {
            font-size: 1.05rem;
            color: var(--c-ink-2);
            margin-bottom: 2rem;
            line-height: 1.78;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            background: var(--c-glass);
            border: 1px solid var(--c-line);
            border-radius: 18px;
            padding: 1.4rem 1.6rem;
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.1);
            backdrop-filter: blur(8px);
        }
        
        /* 社交媒体链接 - 更新样式以支持文字标签 */
        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
            animation: fadeInUp 0.8s ease-out 0.6s both;
            flex-wrap: wrap;
        }
        
        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 50px;
            height: 46px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--c-line);
            border-radius: 12px;
            color: var(--c-ink-2);
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.35s cubic-bezier(.2,.8,.2,1);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .social-link i {
            font-size: 1.05rem;
        }
        
        .social-text {
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            transform: translateY(-5px) scale(1.05);
            color: #ffffff;
            background: rgba(99, 102, 241, 0.8);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
        }
        
        .social-link.github:hover {
            background: linear-gradient(135deg, #1f2937, #475569);
            box-shadow: 0 10px 25px rgba(31, 41, 55, 0.25);
        }
        
        .social-link.scholar:hover {
            background: linear-gradient(135deg, #2563eb, #34a853);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }
        
        .social-link.twitter:hover {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.3);
        }

        .social-link.email:hover {
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
        }

        .social-link.wechat:hover {
            background: linear-gradient(135deg, #16a34a, #0d9488);
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.25);
        }
        
        /* 响应式设计 - 移动端调整 */
        @media (max-width: 768px) {
            .social-links {
                justify-content: center;
                gap: 1rem;
            }
            
            .social-link {
                min-width: 45px;
                height: 45px;
                padding: 0 12px;
            }
            
            .social-link i {
                margin-right: 6px;
                font-size: 1.1rem;
            }
            
            .social-text {
                font-size: 0.8rem;
            }
        }
        
        /* 信息卡片 */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 4rem 0;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            transform: translateY(30px);
            opacity: 0;
        }
        
        .info-card.visible {
            transform: translateY(0);
            opacity: 1;
        }
        
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }
        
        .info-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transition: left 0.8s ease;
        }
        
        .info-card:hover::after {
            left: 100%;
        }
        
        .info-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: #ffffff;
            border-color: rgba(99, 102, 241, 0.25);
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
        }
        
        .card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .info-card:hover .card-icon {
            transform: rotateY(180deg) scale(1.1);
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        
        .card-content {
            color: #1f2937;
            line-height: 1.6;
        }

        .card-content p {
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .card-content p:hover {
            transform: translateX(10px);
            color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        
        /* 新闻滚动区域 */
        .news-section {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.6s ease;
        }
        
        .news-section.visible {
            transform: translateY(0);
            opacity: 1;
        }
        
        .news-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.05), transparent);
            transition: left 1s ease;
        }
        
        .news-section:hover::before {
            left: 100%;
        }
        
        .news-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--c-ink);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.01em;
        }
        .news-title i {
            font-size: 1.6rem;
            color: var(--c-violet);
            background: linear-gradient(135deg, var(--c-violet), var(--c-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .scrollable-news {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            padding: 20px;
            background-color: rgba(248, 250, 252, 0.9);
        }
        
        .scrollable-news ul {
            list-style: none;
            position: relative;
            padding: 0;
            margin: 0;
        }
        
        /* 时间轴竖线 */
        .scrollable-news ul::before {
            content: '';
            position: absolute;
            top: 15px;
            bottom: 30px;
            left: 7px;
            width: 2px;
            background: #cbd5e1;
            z-index: 0;
        }
        
        .scrollable-news li {
            position: relative;
            margin-bottom: 4px;
            padding: 12px 12px 12px 35px;
            line-height: 1.5;
            transition: all 0.3s ease;
            border-radius: 8px;
            border-bottom: 1px solid transparent;
        }
        
        /* 时间轴圆点 */
        .scrollable-news li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #6366f1;
            z-index: 1;
            transition: all 0.3s ease;
        }
        
        .scrollable-news li:hover {
            background-color: rgba(99, 102, 241, 0.08);
            transform: translateX(5px);
        }
        
        .scrollable-news li:hover::before {
            background: #6366f1;
            transform: scale(1.2);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }
        
        .scrollable-news li:last-child {
            border-bottom: none;
        }
        
        /* 滚动条样式 */
        .scrollable-news::-webkit-scrollbar {
            width: 8px;
        }
        
        .scrollable-news::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.05);
            border-radius: 10px;
        }
        
        .scrollable-news::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }
        
        .scrollable-news::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 增强的鼠标粒子特效 */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        .mouse-particle {
            pointer-events: none;
            position: fixed;
            border-radius: 50%;
            z-index: 10000;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }
        
        .particle-trail {
            position: fixed;
            pointer-events: none;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 9998;
            animation: particle-fade 1s ease-out forwards;
        }
        
        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }
        
        /* 鼠标悬停时的元素特效 */
        .hover-effect {
            transition: all 0.3s ease;
        }
        
        .hover-effect:hover {
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
        }
        
        /* 增强的动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .slide-in-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.8s ease;
        }
        
        .slide-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .slide-in-right {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s ease;
        }
        
        .slide-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
            }
            
            .hero-image {
                flex: none;
                max-width: 300px;
            }
            
            .info-cards {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .social-links {
                justify-content: center;
            }
        }
        
        /* 特殊强调文本 */
        .highlight {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }
        
        /* 链接样式 */
        a {
            color: #6366f1;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: #8b5cf6;
        }
        .social-link:hover { color: #fff !important; }
        
        /* 更柔和的突出自己名字的样式 - 稍微调暗版本 */
        .pub-authors strong u,
        strong u {
            color: #cbd5e1 !important;
            font-weight: 700 !important;
            text-decoration: underline !important;
            text-decoration-color: #64748b !important;
            text-decoration-thickness: 1.5px !important;
            text-underline-offset: 2px !important;
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.12), rgba(148, 163, 184, 0.12)) !important;
            padding: 2px 4px !important;
            border-radius: 4px !important;
            text-shadow: none !important;
            box-shadow: none !important;
            position: relative !important;
            display: inline-block !important;
        }
        
        /* 鼠标悬停时的柔和效果 */
        .pub-authors strong u:hover,
        strong u:hover {
            color: #e2e8f0 !important;
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.2), rgba(148, 163, 184, 0.2)) !important;
            text-decoration-color: #475569 !important;
            transform: none !important;
            transition: all 0.3s ease !important;
        }
        
        /* 为了确保在所有地方都生效，添加更具体的选择器 */
        .publication-item .pub-authors strong u,
        .hero-content strong u,
        .card-content strong u {
            color: #cbd5e1 !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, rgba(100, 116, 139, 0.12), rgba(148, 163, 184, 0.12)) !important;
            padding: 2px 4px !important;
            border-radius: 4px !important;
            text-shadow: none !important;
            text-decoration: underline !important;
            text-decoration-color: #64748b !important;
            text-decoration-thickness: 1.5px !important;
        }
        
        /* 精确调整下拉菜单定位 */
        .dropdown {
            position: relative;
        }
        
        .dropdown-toggle {
            cursor: pointer;
        }
        
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.5rem 0;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1001;
            list-style: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        
        .dropdown-menu li {
            margin: 0;
        }
        
        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1.5rem;
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 0 0.5rem;
            white-space: nowrap;
        }
        
        .dropdown-menu a:hover {
            color: #ffffff;
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(5px);
        }
        
        .dropdown-menu a::after {
            display: none;
        }
        
        /* 下拉箭头指示器 */
        .dropdown-toggle::after {
            content: '▼';
            font-size: 0.7em;
            margin-left: 0.5rem;
            transition: transform 0.3s ease;
        }
        
        .dropdown:hover .dropdown-toggle::after {
            transform: rotate(180deg);
        }
        
        /* 响应式设计 - 移动端保持垂直布局 */
        @media (max-width: 768px) {
            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 0;
                margin: 0;
                display: block;
                min-width: auto;
            }
            
            .dropdown-menu a {
                padding: 0.5rem 0;
                border-radius: 0;
            }
        }
        
        /* Awards 列表样式 */
        .awards-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .award-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .award-item:hover {
            transform: translateX(10px);
            background: rgba(99, 102, 241, 0.05);
        }

        .award-icon {
            color: #f59e0b; /* 金色 */
            font-size: 1.1rem;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .award-content {
            flex: 1;
        }

        .award-title {
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
        }

        .award-desc {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 2px;
        }
        
        /* 稍微调整一下 Academic Service 的列表样式 */
        .service-list p {
            margin-bottom: 1.2rem;
            padding-left: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            border-radius: 4px;
            line-height: 1.6;
        }
        
        .service-list p:hover {
            transform: translateX(5px);
            color: #1f2937;
            background: rgba(99, 102, 241, 0.05);
        }
        
        .service-list p::before {
            content: '•';
            position: absolute;
            left: 0.2rem;
            top: 0;
            color: #6366f1;
            font-weight: bold;
            font-size: 1.2rem;
            line-height: 1.6rem;
        }

        /* Experience and Service Section Styles */
        .experience-section, .service-section {
            margin: 4rem 0;
        }

        .experience-header, .service-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .experience-title, .service-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
        }

        .experience-card, .service-card {
            background: rgba(255, 255, 255, 0.85); /* 浅色背景 */
            border-radius: 16px;
            padding: 2.5rem;
            color: #1f2937; /* 深色文字 */
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
            border: 1px solid rgba(15, 23, 42, 0.08);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .experience-card:hover, .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.2);
            background: #ffffff;
        }

        .experience-card::before, .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
        }

        .experience-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .experience-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .experience-list li:last-child {
            margin-bottom: 0;
        }

        .experience-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            top: 0;
            color: #8b5cf6; /* 紫色圆点 */
            font-size: 1.5rem;
            line-height: 1.5rem;
        }

        .experience-list li:hover {
            transform: translateX(10px);
            color: #6366f1;
        }

        /* ===== Research Interests 卡片网格 ===== */
        .research-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .research-card {
            position: relative;
            padding: 1.8rem 1.6rem 1.6rem;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--c-line);
            border-radius: 20px;
            box-shadow: 0 10px 30px -15px rgba(15, 23, 42, 0.12);
            transition: all 0.4s cubic-bezier(.2,.8,.2,1);
            overflow: hidden;
            backdrop-filter: blur(6px);
        }

        .research-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent, var(--c-violet));
            opacity: 0.85;
        }

        .research-card::after {
            content: '';
            position: absolute;
            top: -40%; right: -30%;
            width: 220px; height: 220px;
            background: var(--accent, var(--c-violet));
            opacity: 0.08;
            filter: blur(40px);
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        .research-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px -20px var(--accent-shadow, rgba(99, 102, 241, 0.35));
            border-color: var(--accent-border, rgba(99, 102, 241, 0.35));
        }

        .research-card:hover::after {
            opacity: 0.18;
            transform: scale(1.15);
        }

        .research-card[data-color="violet"] { --accent: #6366f1; --accent-shadow: rgba(99, 102, 241, 0.3); --accent-border: rgba(99, 102, 241, 0.35); }
        .research-card[data-color="amber"]  { --accent: #f59e0b; --accent-shadow: rgba(245, 158, 11, 0.3); --accent-border: rgba(245, 158, 11, 0.4); }
        .research-card[data-color="cyan"]   { --accent: #06b6d4; --accent-shadow: rgba(6, 182, 212, 0.3);  --accent-border: rgba(6, 182, 212, 0.4); }
        .research-card[data-color="rose"]   { --accent: #ec4899; --accent-shadow: rgba(236, 72, 153, 0.3); --accent-border: rgba(236, 72, 153, 0.4); }

        .research-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent, var(--c-violet)), color-mix(in srgb, var(--accent, var(--c-violet)) 60%, white));
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 18px -6px var(--accent-shadow, rgba(99, 102, 241, 0.4));
        }

        .research-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--c-ink);
            margin: 0 0 0.5rem;
            letter-spacing: -0.01em;
        }

        .research-card-desc {
            font-size: 0.95rem;
            color: var(--c-ink-2);
            line-height: 1.65;
            margin: 0 0 1rem;
        }

        .research-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .research-tags .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--c-ink-2);
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid var(--c-line);
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        .research-tags .tag em {
            font-style: normal;
            font-weight: 500;
            color: var(--accent, var(--c-violet));
            font-size: 0.92em;
        }
        .research-tags .tag:hover {
            background: rgba(15, 23, 42, 0.07);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .research-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 移除原有的逐字动画样式，替换为Typed.js样式 */
        .typing-text-container {
            margin: 0.5rem 0 1.5rem 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* Typed.js 打字机效果样式 - 更新为更优雅的字体 */
        .typed-motto {
            font-style: italic;
            font-size: 1.4rem;
            margin: 8px 0 4px;
            min-height: 36px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'EB Garamond', 'Georgia', serif;
            font-weight: 500;
            text-align: left;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }
        
        .typed-cursor {
            color: #6366f1 !important;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="logo">Sixiang Chen</a>
            <ul class="nav-menu">
                <li><a href="/">Story of Me</a></li>
                <li><a href="/file/Resume_of_sixiang_202602.pdf">Resume</a></li>
                <li><a href="/publications/">Publications</a></li>
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Paper Web</a>
                    <ul class="dropdown-menu">
                        <li><a href="/PosterCraft/">PosterCraft</a></li>
                        <li><a href="/PosterOmni/">PosterOmni</a></li>
                        <li><a href="https://alexlai2860.github.io/PosterReward/">PosterReward</a></li>
                        <li><a href="/T3-DiffWeather/">T3-DiffWeather</a></li>
                        <li><a href="/GenEvolve/">GenEvolve</a></li>
                        <li><a href="/UDR_S2Former_deraining/">UDR-S2Former</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- 主要内容 -->
    <main class="main-content">
        {{ content }}
    </main>
    
    <!-- JavaScript -->
    <script>
        // 增强的粒子效果
        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.maxParticles = 100;
                this.init();
            }

            init() {
                document.addEventListener('mousemove', (e) => {
                    this.createParticle(e.clientX, e.clientY);
                    this.createTrail(e.clientX, e.clientY);
                });
                this.animate();
            }

            createParticle(x, y) {
                if (this.particles.length >= this.maxParticles) {
                    this.particles.shift();
                }

                const particle = document.createElement('div');
                particle.className = 'mouse-particle';
                
                const size = Math.random() * 8 + 4;
                const hue = Math.random() * 60 + 200; // 蓝紫色范围
                const brightness = Math.random() * 50 + 50;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = `hsla(${hue}, 80%, ${brightness}%, 0.8)`;
                particle.style.boxShadow = `0 0 20px hsla(${hue}, 80%, ${brightness}%, 0.6)`;
                
                document.body.appendChild(particle);
                
                const velocity = {
                    x: (Math.random() - 0.5) * 4,
                    y: (Math.random() - 0.5) * 4
                };
                
                this.particles.push({
                    element: particle,
                    x: x,
                    y: y,
                    velocity: velocity,
                    life: 1.0,
                    decay: Math.random() * 0.02 + 0.01
                });
            }

            createTrail(x, y) {
                const trail = document.createElement('div');
                trail.className = 'particle-trail';
                trail.style.left = x + 'px';
                trail.style.top = y + 'px';
                
                document.body.appendChild(trail);
                
                setTimeout(() => {
                    if (trail.parentNode) {
                        trail.parentNode.removeChild(trail);
                    }
                }, 1000);
            }

            animate() {
                this.particles.forEach((particle, index) => {
                    particle.x += particle.velocity.x;
                    particle.y += particle.velocity.y;
                    particle.life -= particle.decay;
                    
                    particle.element.style.left = particle.x + 'px';
                    particle.element.style.top = particle.y + 'px';
                    particle.element.style.opacity = particle.life;
                    
                    if (particle.life <= 0) {
                        if (particle.element.parentNode) {
                            particle.element.parentNode.removeChild(particle.element);
                        }
                        this.particles.splice(index, 1);
                    }
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // Typed.js 打字机效果初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 启动粒子系统
            new ParticleSystem();
            
            // 初始化Typed.js打字机效果
            if (typeof Typed !== 'undefined') {
                new Typed('#motto', {
                    strings: [
                        "LOSING GROUND NOW, GAINING MILES TOMORROW",
                        "Flowing water does not vie to be first; its contest is to flow on unceasingly."
                    ],
                    typeSpeed: 45,        /* 从60调整到45，速度更快 */
                    backSpeed: 35,        /* 从40调整到35，删除速度也稍快 */
                    loop: true,
                    startDelay: 2000,
                    backDelay: 3000,
                    showCursor: true,
                    cursorChar: '|'
                });
            } else {
                // 动态加载Typed.js库
                var script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/typed.js@2.0.12';
                script.onload = function() {
                    new Typed('#motto', {
                        strings: [
                            "Losing Ground Now, Gaining Miles Tomorrow!",
                        ],
                        typeSpeed: 45,    /* 从60调整到45 */
                        backSpeed: 35,    /* 从40调整到35 */
                        loop: true,
                        startDelay: 2000,
                        backDelay: 3000,
                        showCursor: true,
                        cursorChar: '|'
                    });
                };
                document.head.appendChild(script);
            }
            
            // 为元素添加悬停效果
            document.querySelectorAll('.info-card, .social-link, .profile-image').forEach(element => {
                element.classList.add('hover-effect');
            });
            
            // 滚动动画
            function handleScrollAnimation() {
                const elements = document.querySelectorAll('.fade-in, .slide-in-left, .slide-in-right, .info-card, .news-section');
                elements.forEach((element, index) => {
                    const elementTop = element.getBoundingClientRect().top;
                    const elementVisible = 100;
                    
                    if (elementTop < window.innerHeight - elementVisible) {
                        setTimeout(() => {
                            element.classList.add('visible');
                        }, index * 150);
                    }
                });
            }
            
            // 导航栏滚动效果
            function handleNavbarScroll() {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            }
            
            handleScrollAnimation();
            handleNavbarScroll();
            
            window.addEventListener('scroll', () => {
                handleScrollAnimation();
                handleNavbarScroll();
            });
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
