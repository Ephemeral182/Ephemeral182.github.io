<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 动态背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 25%, #0f0f23 50%, #000000 100%);
            z-index: -2;
        }
        
        /* 动态光效 */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        .glow-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .glow-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .glow-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-menu a:hover::after {
            width: 100%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1400px; /* 由 1200px 修改为 1600px */
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 - Leonardo.ai风格 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 100vh;
            gap: 4rem;
            position: relative;
            padding: 4rem 0;
        }
        
        .hero-content {
            max-width: 500px; /* 稍微增加宽度以容纳论文信息 */
            margin-left: 0;  /* 移除左边距 */
            margin-right: auto; /* 添加右边距自动调整 */
        }
        
        
        /* Hero Visual - Leonardo.ai风格拼贴 */
        .hero-visual {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            gap: 2rem;
        }
        
        .mosaic-grid {
            position: relative;
            width: 550px; /* 稍微减小 */
            height: 550px;
            margin: 0 auto;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        .mosaic-item {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
        }
        
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        /* 重新设计布局 - 完全无重叠，紧密但清晰的拼贴 */
        .mosaic-1 {
            width: 160px;   /* 大尺寸 */
            height: 230px;  
            top: 30px;
            left: 30px;
            transform: rotate(-8deg);
            z-index: 8;
            animation: itemFloat1 4s ease-in-out infinite;
        }
        
        .mosaic-2 {
            width: 120px;   /* 中等尺寸 */
            height: 170px;  
            top: 50px;
            left: 220px;    /* 确保与mosaic-1不重叠 */
            transform: rotate(12deg);
            z-index: 7;
            animation: itemFloat2 4.5s ease-in-out infinite;
        }
        
        .mosaic-3 {
            width: 140px;   /* 中大尺寸 */
            height: 200px;  
            top: 30px;
            left: 370px;    /* 确保与mosaic-2不重叠 */
            transform: rotate(-5deg);
            z-index: 9;
            animation: itemFloat3 3.8s ease-in-out infinite;
        }
        
        .mosaic-4 {
            width: 110px;   /* 中等尺寸 */
            height: 160px;  
            top: 280px;     /* 确保与mosaic-1不重叠 */
            left: 20px;
            transform: rotate(10deg);
            z-index: 6;
            animation: itemFloat4 4.2s ease-in-out infinite;
        }
        
        .mosaic-5 {
            width: 150px;   /* 大尺寸 */
            height: 215px;  
            top: 250px;     /* 确保与mosaic-2不重叠 */
            left: 160px;
            transform: rotate(-12deg);
            z-index: 5;
            animation: itemFloat5 3.9s ease-in-out infinite;
        }
        
        .mosaic-6 {
            width: 100px;   /* 小尺寸 */
            height: 145px;  
            top: 260px;     /* 确保与mosaic-3不重叠 */
            left: 340px;
            transform: rotate(7deg);
            z-index: 4;
            animation: itemFloat6 4.3s ease-in-out infinite;
        }
        
        .mosaic-7 {
            width: 155px;   /* 大尺寸 */
            height: 225px;  
            top: 470px;     /* 底部行，确保与上方不重叠 */
            left: 40px;
            transform: rotate(-10deg);
            z-index: 3;
            animation: itemFloat7 4.1s ease-in-out infinite;
        }
        
        .mosaic-8 {
            width: 125px;   /* 中大尺寸 */
            height: 180px;  
            top: 490px;     /* 底部行 */
            left: 220px;
            transform: rotate(15deg);
            z-index: 2;
            animation: itemFloat8 3.7s ease-in-out infinite;
        }
        
        /* 证言卡片 */
        .testimonial-card {
            position: absolute;
            bottom: -180px;  /* 向下移动更多 */
            right: -120px;   /* 向右移动更多 */
            width: 440px;    /* 增加宽度 */
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: fadeInUp 1s ease-out 1s both;
        }
        
        .quote-icon {
            font-size: 3rem;
            color: #6366f1;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .testimonial-text {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        
        .testimonial-author strong {
            color: #ffffff;
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        
        .testimonial-author span {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        
        /* 特性卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin: 6rem 0 4rem;
        }
        
        .feature-card {
            background: transparent; /* 修改 */
            border: none; /* 修改 */
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: none; /* 修改 */
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            /* background: rgba(255, 255, 255, 0.08); */ /* 移除背景变化 */
            /* border-color: rgba(99, 102, 241, 0.3); */   /* 移除边框颜色变化 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); /* 保留阴影效果 */
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .feature-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .feature-description {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 响应式设计 - 确保所有尺寸下都不重叠 */
        @media (max-width: 1200px) {
            .mosaic-grid {
                width: 550px;
                height: 600px;
            }
            
            /* 中等屏幕 - 重新计算位置避免重叠 */
            .mosaic-1 { width: 140px; height: 200px; top: 25px; left: 25px; }
            .mosaic-2 { width: 105px; height: 150px; top: 40px; left: 190px; }
            .mosaic-3 { width: 125px; height: 180px; top: 25px; left: 320px; }
            .mosaic-4 { width: 95px; height: 140px; top: 240px; left: 15px; }
            .mosaic-5 { width: 130px; height: 185px; top: 210px; left: 135px; }
            .mosaic-6 { width: 85px; height: 125px; top: 220px; left: 290px; }
            .mosaic-7 { width: 135px; height: 195px; top: 400px; left: 35px; }
            .mosaic-8 { width: 110px; height: 160px; top: 420px; left: 190px; }
        }
        
        @media (max-width: 768px) {
            .hero-visual {
                margin-top: 3rem;
            }
            
            .mosaic-grid {
                width: 450px;
                height: 500px;
            }
            
            /* 移动端 - 三行布局，确保不重叠 */
            .mosaic-1 { width: 115px; height: 165px; top: 20px; left: 20px; }
            .mosaic-2 { width: 85px; height: 122px; top: 30px; left: 155px; }
            .mosaic-3 { width: 100px; height: 145px; top: 20px; left: 260px; }
            .mosaic-4 { width: 80px; height: 115px; top: 200px; left: 15px; }
            .mosaic-5 { width: 105px; height: 150px; top: 180px; left: 115px; }
            .mosaic-6 { width: 70px; height: 100px; top: 190px; left: 240px; }
            .mosaic-7 { width: 110px; height: 160px; top: 340px; left: 30px; }
            .mosaic-8 { width: 90px; height: 130px; top: 360px; left: 160px; }
        }
        
        @media (max-width: 480px) {
            .mosaic-grid {
                width: 350px;
                height: 450px;
            }
            
            /* 小屏幕 - 更紧凑但不重叠 */
            .mosaic-1 { width: 90px; height: 130px; top: 15px; left: 15px; }
            .mosaic-2 { width: 70px; height: 100px; top: 20px; left: 120px; }
            .mosaic-3 { width: 80px; height: 115px; top: 15px; left: 210px; }
            .mosaic-4 { width: 65px; height: 95px; top: 160px; left: 10px; }
            .mosaic-5 { width: 85px; height: 122px; top: 145px; left: 90px; }
            .mosaic-6 { width: 60px; height: 86px; top: 150px; left: 190px; }
            .mosaic-7 { width: 90px; height: 130px; top: 280px; left: 25px; }
            .mosaic-8 { width: 75px; height: 108px; top: 300px; left: 130px; }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 浮动demo图片样式 */
        .floating-demos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .demo-left, .demo-right {
            position: absolute;
            top: 20%;
            width: 300px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.9;
        }
        
        .demo-left {
            left: 20px;
            transform: rotate(-15deg);
            animation: floatLeft 3s ease-in-out infinite alternate;
        }
        
        .demo-right {
            right: 20px;
            transform: rotate(15deg);
            animation: floatRight 3s ease-in-out infinite alternate;
        }
        
        .demo-left img, .demo-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 滚动时的散开效果 */
        .floating-demos.scrolled .demo-left {
            left: -280px;
            opacity: 0.3;
            transform: rotate(-25deg) scale(0.8);
        }
        
        .floating-demos.scrolled .demo-right {
            right: -280px;
            opacity: 0.3;
            transform: rotate(25deg) scale(0.8);
        }
        
        /* 新增：第二组demo图片样式 */
        .demo-second-left, .demo-second-right {
            position: absolute;
            top: 60%;
            width: 280px;
            height: 380px;
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: scale(0.5);
        }
        
        .demo-second-left {
            left: -50px;
            transform: rotate(-20deg) scale(0.5);
        }
        
        .demo-second-right {
            right: -50px;
            transform: rotate(20deg) scale(0.5);
        }
        
        .demo-second-left img, .demo-second-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 第二组图片出现的状态 */
        .floating-demos.second-phase .demo-second-left {
            left: 120px;
            opacity: 0.8;
            transform: rotate(-20deg) scale(1);
            animation: floatSecondLeft 4s ease-in-out infinite alternate;
        }
        
        .floating-demos.second-phase .demo-second-right {
            right: 120px;
            opacity: 0.8;
            transform: rotate(20deg) scale(1);
            animation: floatSecondRight 4s ease-in-out infinite alternate;
        }
        
        /* 第二组图片消失的状态 */
        .floating-demos.third-phase .demo-second-left {
            left: -250px;
            opacity: 0;
            transform: rotate(-30deg) scale(0.6);
        }
        
        .floating-demos.third-phase .demo-second-right {
            right: -250px;
            opacity: 0;
            transform: rotate(30deg) scale(0.6);
        }
        
        /* 第二组浮动动画 */
        @keyframes floatSecondLeft {
            0% { transform: rotate(-20deg) scale(1) translateY(0px); }
            100% { transform: rotate(-20deg) scale(1) translateY(-15px); }
        }
        
        @keyframes floatSecondRight {
            0% { transform: rotate(20deg) scale(1) translateY(0px); }
            100% { transform: rotate(20deg) scale(1) translateY(-15px); }
        }
        
        /* 原有的浮动动画 */
        @keyframes floatLeft {
            0% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(-15deg) translateY(-20px); }
        }
        
        @keyframes floatRight {
            0% { transform: rotate(15deg) translateY(0px); }
            100% { transform: rotate(15deg) translateY(-20px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .demo-left, .demo-right {
                width: 200px;
                height: 280px;
                top: 15%;
            }
            
            .demo-second-left, .demo-second-right {
                width: 180px;
                height: 260px;
                top: 55%;
            }
            
            .demo-left {
                left: 5px;
            }
            
            .demo-right {
                right: 5px;
            }
            
            .demo-second-left {
                left: -30px;
            }
            
            .demo-second-right {
                right: -30px;
            }
            
            .floating-demos.scrolled .demo-left {
                left: -220px;
            }
            
            .floating-demos.scrolled .demo-right {
                right: -220px;
            }
            
            .floating-demos.second-phase .demo-second-left {
                left: 60px;
            }
            
            .floating-demos.second-phase .demo-second-right {
                right: 60px;
            }
            
            .floating-demos.third-phase .demo-second-left {
                left: -200px;
            }
            
            .floating-demos.third-phase .demo-second-right {
                right: -200px;
            }
        }
        
        /* 确保主要内容在浮动元素之上 */
        .hero {
            position: relative;
            z-index: 2;
        }
        
        /* 添加轻柔的整体浮动动画 */
        @keyframes gentleFloat {
            0%, 100% { 
                transform: translateY(0px); 
            }
            50% { 
                transform: translateY(-10px); 
            }
        }
        
        /* 为每个项目定义独立的浮动动画 */
        @keyframes itemFloat1 {
            0%, 100% { transform: rotate(-8deg) translateY(0px); }
            50% { transform: rotate(-8deg) translateY(-8px); }
        }
        
        @keyframes itemFloat2 {
            0%, 100% { transform: rotate(12deg) translateY(0px); }
            50% { transform: rotate(12deg) translateY(-6px); }
        }
        
        @keyframes itemFloat3 {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(-5deg) translateY(-10px); }
        }
        
        @keyframes itemFloat4 {
            0%, 100% { transform: rotate(10deg) translateY(0px); }
            50% { transform: rotate(10deg) translateY(-7px); }
        }
        
        @keyframes itemFloat5 {
            0%, 100% { transform: rotate(-12deg) translateY(0px); }
            50% { transform: rotate(-12deg) translateY(-9px); }
        }
        
        @keyframes itemFloat6 {
            0%, 100% { transform: rotate(7deg) translateY(0px); }
            50% { transform: rotate(7deg) translateY(-5px); }
        }
        
        @keyframes itemFloat7 {
            0%, 100% { transform: rotate(-10deg) translateY(0px); }
            50% { transform: rotate(-10deg) translateY(-8px); }
        }
        
        @keyframes itemFloat8 {
            0%, 100% { transform: rotate(15deg) translateY(0px); }
            50% { transform: rotate(15deg) translateY(-6px); }
        }
        
        /* 增强hover效果，适应不同大小 */
        .mosaic-item:hover {
            transform: scale(1.08) !important; /* 稍微减小hover缩放，避免大图片过度放大 */
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            z-index: 25; /* 提高z-index确保hover时在最上层 */
            border-color: rgba(99, 102, 241, 0.5);
            animation-play-state: paused;
        }
        
        .mosaic-item:hover img {
            transform: scale(1.03); /* 稍微减小图片缩放 */
        }
        
        /* Aesthetic Description */
        .aesthetic-description {
            margin-top: 6rem;
        }
        
        .aesthetic-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .aesthetic-text {
            font-size: 1.2rem;
            color: #a1a1aa;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
        }
        
        
        /* 新的横向布局样式 */
        .horizontal-demo-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            margin: 4rem 0;
        }
        
        .demo-row {

                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 80px rgba(99, 102, 241, 0.3);
            animation: containerBreath 4s ease-in-out infinite;
        }

        @keyframes containerBreath {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 20px 60px rgba(0,0,0,0.4), 
                    inset 0 1px 0 rgba(255,255,255,0.2), 
                    0 0 80px rgba(99,102,241,0.3);
            }
            50% { 
                transform: scale(1.02);
                box-shadow: 
                    0 30px 80px rgba(0,0,0,0.5), 
                    inset 0 1px 0 rgba(255,255,255,0.3), 
                    0 0 120px rgba(139,92,246,0.4);
            }
        }

        .ds-tab-button {
            background: transparent;
            border: none;
            padding: 1.2rem 0.8rem; /* 调整padding，减少左右padding给文字更多空间 */
            font-size: clamp(1rem, 2vw, 1.3rem); /* 稍微减小字体，确保文字能完整显示 */
            font-weight: 700;
            color: #aaaaaa;
            cursor: pointer;
            transition: all 0.2s ease; /* 简化transition时间 */
            position: relative;
            text-transform: none;
            font-family: inherit;
            white-space: nowrap;
            opacity: 0.7;
            transform: scale(0.95);
            filter: blur(0.2px);
            flex: 1;
            text-align: center;
            border-radius: 15px;
            overflow: visible; /* 改为visible，防止文字被截断 */
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                rgba(255, 255, 255, 0.02) 100%);
            min-width: 0; /* 确保flex项目可以收缩 */
            display: flex; /* 使用flex布局 */
            align-items: center; /* 垂直居中 */
            justify-content: center; /* 水平居中 */
        }

        .ds-tab-button::before {
            display: none; /* 简单地隐藏这个白条效果 */
        }

        .ds-tab-button:hover::before {
            left: 100%;
        }

        .ds-tab-button.active {
            opacity: 1;
            transform: scale(1.05); /* Active时放大一点 */
            filter: blur(0px);
            z-index: 10;
            background: linear-gradient(135deg, 
                rgba(192, 88, 243, 0.25) 0%, /* 增强背景色 */
                rgba(255, 138, 84, 0.25) 100%);
            border: 1px solid rgba(192, 88, 243, 0.5); /* 增强边框 */
            box-shadow: 
                0 10px 40px rgba(192, 88, 243, 0.5), /* 增强阴影 */
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 0 70px rgba(192, 88, 243, 0.7); /* 增强光晕 */
            animation: activeGlow 2s ease-in-out infinite;
        }
        
        @keyframes activeGlow {
            0%, 100% { 
                box-shadow: 
                    0 10px 40px rgba(192,88,243,0.5),
                    inset 0 1px 0 rgba(255,255,255,0.3),
                    0 0 70px rgba(192,88,243,0.7);
            }
            50% { 
                box-shadow: 
                    0 15px 50px rgba(192,88,243,0.7),
                    inset 0 1px 0 rgba(255,255,255,0.4),
                    0 0 100px rgba(255,138,84,0.9);
            }
        }

        .ds-tab-text {
            position: relative;
            z-index: 2;
            transition: all 0.6s ease;
        }

        .ds-tab-button.active .ds-tab-text {
            background: linear-gradient(90deg, #C058F3, #FF8A54);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            filter: drop-shadow(0 0 25px rgba(192, 88, 243, 0.9)); /* 增强文字光晕 */
            animation: textShimmer 3s ease-in-out infinite;
        }

        @keyframes textShimmer {
            0%, 100% { 
                filter: drop-shadow(0 0 25px rgba(192,88,243,0.9));
            }
            50% { 
                filter: drop-shadow(0 0 35px rgba(255,138,84,1));
            }
        }
        
        .ds-tab-button:not(.active):hover {
            opacity: 0.9; /* 悬停时更明显 */
            transform: scale(1); /* 悬停时恢复正常大小或微放大 */
            filter: blur(0px); /* 悬停时去除模糊 */
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.05) 100%);
            box-shadow: 
                0 8px 30px rgba(255, 255, 255, 0.25), /* 增强悬停阴影 */
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            color: #dddddd; /* 悬停时文字更亮 */
        }
        
        /* 移除原有的 ds-tab-carousel::after 粒子效果，因为它可能与新的背景和阴影冲突 */
        .ds-tab-carousel::after {
            display: none;
        }

        /* 移除黑色边缘遮罩 */
        .ds-tab-navigation::before,
        .ds-tab-navigation::after {
            display: none; 
        }

        /* Main Display Area - 保持透明 */
        .ds-main-display-area {
            background: transparent;
            backdrop-filter: none;
            border-radius: 16px;
            padding: 2rem 0; /* 上下padding，左右不加，让内容区宽度由 ds-container 控制 */
            border: none;
            max-width: 1200px; /* 与 carousel 宽度匹配 */
            margin: 0 auto;
        }

        .ds-content-wrapper {
            position: relative;
            min-height: 450px;
            overflow: hidden; /* 用于切换动画 */
        }

        .ds-dataset-content {
            position: absolute; /* 用于切换动画 */
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.2s ease, transform 0.2s ease; /* 大幅简化动画时间 */
            pointer-events: none;
        }

        .ds-dataset-content.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }
        
        /* 图片和描述样式保持不变，仅确保它们在透明背景下看起来良好 */
        .ds-image-grid {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            background: transparent; 
            min-height: 350px;
            width: 100%;
        }

        .ds-showcase-image {
            max-width: 100%;
            max-height: 60vh; /* 限制最大高度 */
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            background: transparent;
            display: block;
            margin: 0 auto;
             box-shadow: 0 10px 30px rgba(0,0,0,0.2); /* 给图片加点阴影 */
        }

        .ds-description {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .ds-description h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            line-height: 1.3;
            text-align: center;
        }

        .ds-description p {
            color: #a1a1aa;
            font-size: 1rem;
            line-height: 1.7;
            text-align: center;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .ds-tab-carousel {
                gap: 0.6rem;
                padding: 1.2rem 1rem;
                max-width: 100%; /* 移除宽度限制 */
            }
            
            .ds-tab-button {
                padding: 1rem 0.6rem; /* 进一步减少padding */
                font-size: clamp(0.9rem, 1.8vw, 1.1rem); /* 调整字体大小 */
            }
        }

        @media (max-width: 768px) {
            .ds-tab-navigation {
                padding: 1rem 0;
            }
            
            .ds-tab-carousel {
                flex-direction: column;
                gap: 1rem;
                padding: 1.5rem 1rem;
                max-width: 95%;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
            
            .ds-tab-button {
                padding: 1rem 1.5rem;
                font-size: 1.1rem; /* 移动端使用固定字体大小 */
                width: 100%;
                opacity: 0.8 !important;
                transform: scale(1) !important;
                filter: blur(0px) !important;
                overflow: visible !important; /* 确保移动端也不截断 */
            }
            
            .ds-tab-button.active {
                transform: scale(1.03) !important; /* Active时轻微放大 */
            }
            
            .ds-main-display-area {
                max-width: 100%;
                padding: 1.5rem;
                margin: 0 auto; /* 确保内容区居中 */
            }
        }

        @media (max-width: 480px) {
            .ds-tab-carousel {
                padding: 1rem;
                max-width: 98%;
            }
            
            .ds-tab-button {
                padding: 0.8rem 1rem;
                font-size: 1rem; /* 小屏幕固定字体大小 */
                overflow: visible !important; /* 确保小屏幕也不截断 */
            }
            
            .ds-main-display-area {
                padding: 1rem;
            }
             .ds-description h3 {
                font-size: 1.6rem;
            }
             .ds-description p {
                font-size: 0.9rem;
            }
        }

        /* What is PosterCraft Section - 更新为与Technical Framework相同的炫酷特效 */
        .what-is-section {
            padding: 8rem 0;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        .what-is-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        /* 更新标题样式 - 使用与Technical Framework相同的特效 */
        .what-is-title {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, 
                #667eea 0%, 
                #764ba2 20%, 
                #f093fb 40%, 
                #f5576c 60%, 
                #4facfe 80%, 
                #00f2fe 100%);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: techGradientFlow 8s ease-in-out infinite;
            letter-spacing: -0.03em;
            line-height: 1.1;
            text-align: center;
        }

        /* 更新emoji样式 - 确保居中 */
        .what-is-emoji {
            font-size: 3rem;
            margin: 1rem 0;
            display: block; /* 改为block */
            text-align: center; /* 添加居中对齐 */
            animation: techEmojiPulse 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }

        /* 更新副标题样式 */
        .what-is-subtitle {
            font-size: 1.4rem;
            color: #cbd5e1;
            font-weight: 300;
            letter-spacing: 0.5px;
            max-width: 800px;
            margin: 0 auto 4rem;
            line-height: 1.7;
            text-align: center;
        }

        /* 如果动画不存在，添加动画定义 */
        @keyframes techGradientFlow {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 25%; }
            50% { background-position: 200% 50%; }
            75% { background-position: 300% 75%; }
        }

        @keyframes techEmojiPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        /* 添加到现有CSS的末尾，大约在4000行左右 */

        /* 跳转目标高亮动画 */
        @keyframes sectionHighlight {
            0% { 
                background: transparent; 
                transform: scale(1);
            }
            25% { 
                background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
                transform: scale(1.01);
            }
            50% { 
                background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
                transform: scale(1.01);
            }
            75% { 
                background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
                transform: scale(1.01);
            }
            100% { 
                background: transparent; 
                transform: scale(1);
            }
        }

        /* 提示文字淡入动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* 增强第一个stage卡片的交互效果 */
        .stage-card.stage-1 {
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .stage-card.stage-1::after {
            content: '👆 点击查看效果';
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            color: white;
            padding: 0.3rem 0.6rem;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0;
            transform: scale(0.8) rotate(-10deg);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            animation: badgeFloat 2s ease-in-out infinite;
        }

        .stage-card.stage-1:hover::after {
            opacity: 1;
            transform: scale(1) rotate(-5deg);
        }

        @keyframes badgeFloat {
            0%, 100% { transform: scale(0.8) rotate(-10deg) translateY(0px); }
            50% { transform: scale(0.8) rotate(-10deg) translateY(-3px); }
        }
    </style>
</head>
<body>
    <!-- 背景效果 -->
    <div class="bg-gradient"></div>
    <div class="bg-effects">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">{{ site.title }}</a>
            <ul class="nav-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/publications/">论文</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- 主要内容 -->
    <div class="main-content">
        {{ content }}
    </div>
    
    <!-- JavaScript -->
    <script>
        // 滚动动画
        function handleScrollAnimation() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.glow-orb');
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 0.02;
                const x = e.clientX * speed;
                const y = e.clientY * speed;
                
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
        
        // 初始化脚本
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM fully loaded and parsed");
            handleScrollAnimation();
            window.addEventListener('scroll', handleScrollAnimation);

            // Text Rendering Optimization 卡片跳转功能
            const textRenderingCard = document.querySelector('.stage-card.stage-1');
            if (textRenderingCard) {
                textRenderingCard.style.cursor = 'pointer';
                
                textRenderingCard.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                    this.style.boxShadow = '0 25px 60px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2)';
                    
                    const hintText = document.createElement('div');
                    hintText.className = 'jump-hint';
                    hintText.textContent = '点击查看优化效果 ↓';
                    hintText.style.cssText = `
                        position: absolute;
                        bottom: -40px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: linear-gradient(45deg, #6366f1, #8b5cf6);
                        color: white;
                        padding: 0.5rem 1rem;
                        border-radius: 20px;
                        font-size: 0.8rem;
                        font-weight: 600;
                        white-space: nowrap;
                        animation: fadeInUp 0.3s ease;
                        z-index: 20;
                        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
                    `;
                    this.appendChild(hintText);
                });
                
                textRenderingCard.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                    this.style.boxShadow = '';
                    const hintText = this.querySelector('.jump-hint');
                    if (hintText) {
                        hintText.remove();
                    }
                });
                
                textRenderingCard.addEventListener('click', function() {
                    const targetSection = document.getElementById('text-optimization');
                    if (targetSection) {
                        this.style.transform = 'scale(0.98)';
                        setTimeout(() => {
                            this.style.transform = '';
                        }, 150);
                        
                        targetSection.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                        
                        setTimeout(() => {
                            targetSection.style.animation = 'sectionHighlight 2s ease';
                        }, 800);
                    }
                });
                
                console.log("Text Rendering Optimization jump functionality added!");
            }

            // Floating Demos script
            const floatingDemos = document.querySelector('.floating-demos');
            if (floatingDemos) {
                window.addEventListener('scroll', function() {
                    const scrollY = window.scrollY;
                    const windowHeight = window.innerHeight;
                    
                    if (scrollY > 100) {
                        floatingDemos.classList.add('scrolled');
                    } else {
                        floatingDemos.classList.remove('scrolled');
                    }
                    
                    if (scrollY > windowHeight * 0.3 && scrollY < windowHeight * 1.2) {
                        floatingDemos.classList.add('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    } else if (scrollY <= windowHeight * 0.3) {
                        floatingDemos.classList.remove('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    }
                    
                    if (scrollY > windowHeight * 1.2) {
                        floatingDemos.classList.add('third-phase');
                        floatingDemos.classList.remove('second-phase');
                    }
                });
            }

            // Dataset Showcase - 优化版本，解决卡顿问题
            console.log("Initializing Dataset Showcase...");
            
            const carousel = document.getElementById('ds-carousel');
            const contentSections = document.querySelectorAll('.ds-main-display-area .ds-dataset-content');
            
            if (carousel && contentSections.length > 0) {
                // 固定的数据集信息
                const datasetsInfo = [
                    { name: 'Text-Render-2M' },
                    { name: 'HQ-Poster-100K' },
                    { name: 'Poster-Preference-100K' },
                    { name: 'Poster-Reflect-120K' }
                ];

                let currentActiveDatasetIndex = 1; // 从第2个开始（HQ-Poster-100K）
                let lastClickTime = 0; // 防抖机制

                // 防抖函数
                function debounce(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func(...args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                }

                // 立即切换内容，无动画
                function switchContent(targetIndex) {
                    // 立即更新内容
                    contentSections.forEach((content, i) => {
                        if (i === targetIndex) {
                            content.style.opacity = '1';
                            content.style.transform = 'translateY(0)';
                            content.style.position = 'relative';
                            content.style.pointerEvents = 'auto';
                            content.classList.add('active');
                        } else {
                            content.style.opacity = '0';
                            content.style.transform = 'translateY(20px)';
                            content.style.position = 'absolute';
                            content.style.pointerEvents = 'none';
                            content.classList.remove('active');
                        }
                    });
                }

                // 更新按钮状态
                function updateActiveButton() {
                    const buttons = carousel.querySelectorAll('.ds-tab-button');
                    buttons.forEach((button, index) => {
                        if (index === currentActiveDatasetIndex) {
                            button.classList.add('active');
                        } else {
                            button.classList.remove('active');
                        }
                    });
                }

                // 处理点击事件（带防抖）
                const handleClick = debounce((targetIndex) => {
                    if (targetIndex !== currentActiveDatasetIndex) {
                        console.log(`Switching to dataset ${targetIndex}: ${datasetsInfo[targetIndex].name}`);
                        currentActiveDatasetIndex = targetIndex;
                        updateActiveButton();
                        switchContent(targetIndex);
                }
                }, 100); // 100ms防抖

                // 生成固定的四个按钮
                function createFixedTabs() {
                    carousel.innerHTML = ''; // Clear old buttons
                    
                    datasetsInfo.forEach((dataset, index) => {
                        const button = document.createElement('button');
                        button.className = 'ds-tab-button';
                        button.setAttribute('data-index', index);
                        
                        const span = document.createElement('span');
                        span.className = 'ds-tab-text';
                        span.textContent = dataset.name;
                        button.appendChild(span);
                        
                        // 使用事件委托和防抖机制
                        button.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            const targetIndex = parseInt(button.getAttribute('data-index'));
                            handleClick(targetIndex);
                        });
                        
                        carousel.appendChild(button);
                        });
                    }
                    
                // 初始化
                if (datasetsInfo.length > 0) {
                    createFixedTabs();
                    updateActiveButton();
                    switchContent(currentActiveDatasetIndex);
                    console.log("Dataset Showcase initialized successfully!");
                    }
                } else {
                console.log("Dataset carousel elements not found.");
                }
        
            // 平滑滚动 - 只保留一个版本
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        });
    </script>
