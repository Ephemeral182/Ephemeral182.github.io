<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 动态背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #16213e 25%, #0f0f23 50%, #000000 100%);
            z-index: -2;
        }
        
        /* 动态光效 */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }
        
        .glow-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .glow-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .glow-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #10b981, #3b82f6);
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-menu a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }
        
        .nav-menu a:hover::after {
            width: 100%;
        }
        
        /* 主要内容 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1400px; /* 由 1200px 修改为 1600px */
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Hero区域 - Leonardo.ai风格 */
        .hero {
            display: flex;
            align-items: center;
            min-height: 100vh;
            gap: 4rem;
            position: relative;
            padding: 4rem 0;
        }
        
        .hero-content {
            max-width: 500px; /* 稍微增加宽度以容纳论文信息 */
            margin-left: 6rem;  /* 稍微调整左边距 */
        }
        
        .hero-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .hero-title {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        
        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        
        /* Hero Visual - Leonardo.ai风格拼贴 */
        .hero-visual {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            gap: 2rem;
        }
        
        .mosaic-grid {
            position: relative;
            width: 550px; /* 稍微减小 */
            height: 550px;
            margin: 0 auto;
            animation: gentleFloat 6s ease-in-out infinite;
        }
        
        .mosaic-item {
            position: absolute;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            max-width: calc(100% - 40px);
            max-height: calc(100% - 40px);
        }
        
        .mosaic-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        /* 重新设计布局 - 完全无重叠，紧密但清晰的拼贴 */
        .mosaic-1 {
            width: 160px;   /* 大尺寸 */
            height: 230px;  
            top: 30px;
            left: 30px;
            transform: rotate(-8deg);
            z-index: 8;
            animation: itemFloat1 4s ease-in-out infinite;
        }
        
        .mosaic-2 {
            width: 120px;   /* 中等尺寸 */
            height: 170px;  
            top: 50px;
            left: 220px;    /* 确保与mosaic-1不重叠 */
            transform: rotate(12deg);
            z-index: 7;
            animation: itemFloat2 4.5s ease-in-out infinite;
        }
        
        .mosaic-3 {
            width: 140px;   /* 中大尺寸 */
            height: 200px;  
            top: 30px;
            left: 370px;    /* 确保与mosaic-2不重叠 */
            transform: rotate(-5deg);
            z-index: 9;
            animation: itemFloat3 3.8s ease-in-out infinite;
        }
        
        .mosaic-4 {
            width: 110px;   /* 中等尺寸 */
            height: 160px;  
            top: 280px;     /* 确保与mosaic-1不重叠 */
            left: 20px;
            transform: rotate(10deg);
            z-index: 6;
            animation: itemFloat4 4.2s ease-in-out infinite;
        }
        
        .mosaic-5 {
            width: 150px;   /* 大尺寸 */
            height: 215px;  
            top: 250px;     /* 确保与mosaic-2不重叠 */
            left: 160px;
            transform: rotate(-12deg);
            z-index: 5;
            animation: itemFloat5 3.9s ease-in-out infinite;
        }
        
        .mosaic-6 {
            width: 100px;   /* 小尺寸 */
            height: 145px;  
            top: 260px;     /* 确保与mosaic-3不重叠 */
            left: 340px;
            transform: rotate(7deg);
            z-index: 4;
            animation: itemFloat6 4.3s ease-in-out infinite;
        }
        
        .mosaic-7 {
            width: 155px;   /* 大尺寸 */
            height: 225px;  
            top: 470px;     /* 底部行，确保与上方不重叠 */
            left: 40px;
            transform: rotate(-10deg);
            z-index: 3;
            animation: itemFloat7 4.1s ease-in-out infinite;
        }
        
        .mosaic-8 {
            width: 125px;   /* 中大尺寸 */
            height: 180px;  
            top: 490px;     /* 底部行 */
            left: 220px;
            transform: rotate(15deg);
            z-index: 2;
            animation: itemFloat8 3.7s ease-in-out infinite;
        }
        
        /* 证言卡片 */
        .testimonial-card {
            position: absolute;
            bottom: -180px;  /* 向下移动更多 */
            right: -120px;   /* 向右移动更多 */
            width: 440px;    /* 增加宽度 */
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: fadeInUp 1s ease-out 1s both;
        }
        
        .quote-icon {
            font-size: 3rem;
            color: #6366f1;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .testimonial-text {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        
        .testimonial-author strong {
            color: #ffffff;
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        
        .testimonial-author span {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        /* 特性卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin: 6rem 0 4rem;
        }
        
        .feature-card {
            background: transparent; /* 修改 */
            border: none; /* 修改 */
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: none; /* 修改 */
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            /* background: rgba(255, 255, 255, 0.08); */ /* 移除背景变化 */
            /* border-color: rgba(99, 102, 241, 0.3); */   /* 移除边框颜色变化 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); /* 保留阴影效果 */
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .feature-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .feature-description {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 响应式设计 - 确保所有尺寸下都不重叠 */
        @media (max-width: 1200px) {
            .mosaic-grid {
                width: 550px;
                height: 600px;
            }
            
            /* 中等屏幕 - 重新计算位置避免重叠 */
            .mosaic-1 { width: 140px; height: 200px; top: 25px; left: 25px; }
            .mosaic-2 { width: 105px; height: 150px; top: 40px; left: 190px; }
            .mosaic-3 { width: 125px; height: 180px; top: 25px; left: 320px; }
            .mosaic-4 { width: 95px; height: 140px; top: 240px; left: 15px; }
            .mosaic-5 { width: 130px; height: 185px; top: 210px; left: 135px; }
            .mosaic-6 { width: 85px; height: 125px; top: 220px; left: 290px; }
            .mosaic-7 { width: 135px; height: 195px; top: 400px; left: 35px; }
            .mosaic-8 { width: 110px; height: 160px; top: 420px; left: 190px; }
        }
        
        @media (max-width: 768px) {
            .hero-visual {
                margin-top: 3rem;
            }
            
            .mosaic-grid {
                width: 450px;
                height: 500px;
            }
            
            /* 移动端 - 三行布局，确保不重叠 */
            .mosaic-1 { width: 115px; height: 165px; top: 20px; left: 20px; }
            .mosaic-2 { width: 85px; height: 122px; top: 30px; left: 155px; }
            .mosaic-3 { width: 100px; height: 145px; top: 20px; left: 260px; }
            .mosaic-4 { width: 80px; height: 115px; top: 200px; left: 15px; }
            .mosaic-5 { width: 105px; height: 150px; top: 180px; left: 115px; }
            .mosaic-6 { width: 70px; height: 100px; top: 190px; left: 240px; }
            .mosaic-7 { width: 110px; height: 160px; top: 340px; left: 30px; }
            .mosaic-8 { width: 90px; height: 130px; top: 360px; left: 160px; }
        }
        
        @media (max-width: 480px) {
            .mosaic-grid {
                width: 350px;
                height: 450px;
            }
            
            /* 小屏幕 - 更紧凑但不重叠 */
            .mosaic-1 { width: 90px; height: 130px; top: 15px; left: 15px; }
            .mosaic-2 { width: 70px; height: 100px; top: 20px; left: 120px; }
            .mosaic-3 { width: 80px; height: 115px; top: 15px; left: 210px; }
            .mosaic-4 { width: 65px; height: 95px; top: 160px; left: 10px; }
            .mosaic-5 { width: 85px; height: 122px; top: 145px; left: 90px; }
            .mosaic-6 { width: 60px; height: 86px; top: 150px; left: 190px; }
            .mosaic-7 { width: 90px; height: 130px; top: 280px; left: 25px; }
            .mosaic-8 { width: 75px; height: 108px; top: 300px; left: 130px; }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #5855eb, #7c3aed);
        }
        
        /* 浮动demo图片样式 */
        .floating-demos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        
        .demo-left, .demo-right {
            position: absolute;
            top: 20%;
            width: 300px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.9;
        }
        
        .demo-left {
            left: 20px;
            transform: rotate(-15deg);
            animation: floatLeft 3s ease-in-out infinite alternate;
        }
        
        .demo-right {
            right: 20px;
            transform: rotate(15deg);
            animation: floatRight 3s ease-in-out infinite alternate;
        }
        
        .demo-left img, .demo-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        /* 滚动时的散开效果 */
        .floating-demos.scrolled .demo-left {
            left: -280px;
            opacity: 0.3;
            transform: rotate(-25deg) scale(0.8);
        }
        
        .floating-demos.scrolled .demo-right {
            right: -280px;
            opacity: 0.3;
            transform: rotate(25deg) scale(0.8);
        }
        
        /* 新增：第二组demo图片样式 */
        .demo-second-left, .demo-second-right {
            position: absolute;
            top: 60%;
            width: 280px;
            height: 380px;
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: scale(0.5);
        }
        
        .demo-second-left {
            left: -50px;
            transform: rotate(-20deg) scale(0.5);
        }
        
        .demo-second-right {
            right: -50px;
            transform: rotate(20deg) scale(0.5);
        }
        
        .demo-second-left img, .demo-second-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        
        /* 第二组图片出现的状态 */
        .floating-demos.second-phase .demo-second-left {
            left: 120px;
            opacity: 0.8;
            transform: rotate(-20deg) scale(1);
            animation: floatSecondLeft 4s ease-in-out infinite alternate;
        }
        
        .floating-demos.second-phase .demo-second-right {
            right: 120px;
            opacity: 0.8;
            transform: rotate(20deg) scale(1);
            animation: floatSecondRight 4s ease-in-out infinite alternate;
        }
        
        /* 第二组图片消失的状态 */
        .floating-demos.third-phase .demo-second-left {
            left: -250px;
            opacity: 0;
            transform: rotate(-30deg) scale(0.6);
        }
        
        .floating-demos.third-phase .demo-second-right {
            right: -250px;
            opacity: 0;
            transform: rotate(30deg) scale(0.6);
        }
        
        /* 第二组浮动动画 */
        @keyframes floatSecondLeft {
            0% { transform: rotate(-20deg) scale(1) translateY(0px); }
            100% { transform: rotate(-20deg) scale(1) translateY(-15px); }
        }
        
        @keyframes floatSecondRight {
            0% { transform: rotate(20deg) scale(1) translateY(0px); }
            100% { transform: rotate(20deg) scale(1) translateY(-15px); }
        }
        
        /* 原有的浮动动画 */
        @keyframes floatLeft {
            0% { transform: rotate(-15deg) translateY(0px); }
            100% { transform: rotate(-15deg) translateY(-20px); }
        }
        
        @keyframes floatRight {
            0% { transform: rotate(15deg) translateY(0px); }
            100% { transform: rotate(15deg) translateY(-20px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .demo-left, .demo-right {
                width: 200px;
                height: 280px;
                top: 15%;
            }
            
            .demo-second-left, .demo-second-right {
                width: 180px;
                height: 260px;
                top: 55%;
            }
            
            .demo-left {
                left: 5px;
            }
            
            .demo-right {
                right: 5px;
            }
            
            .demo-second-left {
                left: -30px;
            }
            
            .demo-second-right {
                right: -30px;
            }
            
            .floating-demos.scrolled .demo-left {
                left: -220px;
            }
            
            .floating-demos.scrolled .demo-right {
                right: -220px;
            }
            
            .floating-demos.second-phase .demo-second-left {
                left: 60px;
            }
            
            .floating-demos.second-phase .demo-second-right {
                right: 60px;
            }
            
            .floating-demos.third-phase .demo-second-left {
                left: -200px;
            }
            
            .floating-demos.third-phase .demo-second-right {
                right: -200px;
            }
        }
        
        /* 确保主要内容在浮动元素之上 */
        .hero {
            position: relative;
            z-index: 2;
        }
        
        /* 添加轻柔的整体浮动动画 */
        @keyframes gentleFloat {
            0%, 100% { 
                transform: translateY(0px); 
            }
            50% { 
                transform: translateY(-10px); 
            }
        }
        
        /* 为每个项目定义独立的浮动动画 */
        @keyframes itemFloat1 {
            0%, 100% { transform: rotate(-8deg) translateY(0px); }
            50% { transform: rotate(-8deg) translateY(-8px); }
        }
        
        @keyframes itemFloat2 {
            0%, 100% { transform: rotate(12deg) translateY(0px); }
            50% { transform: rotate(12deg) translateY(-6px); }
        }
        
        @keyframes itemFloat3 {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(-5deg) translateY(-10px); }
        }
        
        @keyframes itemFloat4 {
            0%, 100% { transform: rotate(10deg) translateY(0px); }
            50% { transform: rotate(10deg) translateY(-7px); }
        }

        /* Main Display Area - 移除黑色背景，确保对齐 */
        .ds-main-display-area {
            background: rgba(17, 17, 17, 0.3); /* 降低透明度 */
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05); /* 降低边框透明度 */
            max-width: 900px;
            margin: 0 auto;
            /* 确保完全居中对齐 */
            position: relative;
        }

        .ds-content-wrapper {
            position: relative;
            min-height: 450px;
            overflow: hidden;
            /* 确保内容居中 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ds-dataset-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            /* 确保内容垂直居中 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 450px;
        }

        .ds-dataset-content.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            position: relative;
        }

        .ds-dataset-content.prev {
            opacity: 0;
            transform: translateX(-50px);
        }

        .ds-dataset-content.next {
            opacity: 0;
            transform: translateX(50px);
        }

        /* 图片区域 - 完全去除黑色背景 */
        .ds-image-grid {
            margin-bottom: 1.5rem; /* 从2rem减少到1.5rem */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            background: transparent; /* 完全透明背景 */
            min-height: 350px;
            /* 确保图片容器居中 */
            width: 100%;
        }

        .ds-showcase-image {
            max-width: 100%;
            max-height: 60vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            /* 移除任何背景色 */
            background: transparent;
            /* 确保图片居中显示 */
            display: block;
            margin: 0 auto;
        }

        .ds-description {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
            /* 确保描述文字居中对齐 */
            padding: 0 1rem;
        }

        .ds-description h3 {
            font-size: 1.8rem; /* 从2rem减少到1.8rem */
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            line-height: 1.3;
            /* 确保标题居中 */
            text-align: center;
        }

        .ds-description p {
            color: #a1a1aa;
            font-size: 1rem; /* 从1.1rem减少到1rem */
            line-height: 1.7;
            /* 确保段落文字居中 */
            text-align: center;
        }

        /* Responsive Design - 保持对齐 */
        @media (max-width: 1024px) {
            .ds-container {
                max-width: 900px;
                padding: 0 2rem; /* 增加侧边距确保对齐 */
            }
            
            .ds-tab-carousel {
                gap: 4rem;
            }
            
            .ds-main-display-area {
                max-width: 750px;
                margin: 0 auto; /* 确保居中 */
            }
            
            .ds-tab-navigation::before,
            .ds-tab-navigation::after {
                width: 120px; /* 调整遮罩宽度 */
            }
        }

        @media (max-width: 768px) {
            .ds-container {
                max-width: 100%;
                padding: 0 1rem;
            }
            
            .ds-main-display-area {
                max-width: 100%;
                padding: 1.5rem;
                background: rgba(17, 17, 17, 0.4); /* 移动端稍微增加背景透明度 */
                margin: 0 1rem; /* 确保两边有间距 */
            }
            
            .ds-tab-carousel {
                gap: 3rem;
            }
            
            .ds-tab-navigation::before,
            .ds-tab-navigation::after {
                width: 80px;
            }
        }

        @media (max-width: 480px) {
            .ds-main-display-area {
                padding: 1rem;
                margin: 0 0.5rem;
            }
            
            .ds-tab-carousel {
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 背景效果 -->
    <div class="bg-gradient"></div>
    <div class="bg-effects">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">{{ site.title }}</a>
            <ul class="nav-menu">
                <li><a href="/">首页</a></li>
                <li><a href="/publications/">论文</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- 主要内容 -->
    <div class="main-content">
        {{ content }}
    </div>
    
    <!-- JavaScript -->
    <script>
        // 滚动动画
        function handleScrollAnimation() {
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.glow-orb');
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 0.02;
                const x = e.clientX * speed;
                const y = e.clientY * speed;
                
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
        
        // 初始化脚本
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM fully loaded and parsed"); // 调试信息
            handleScrollAnimation(); // 用于其他部分的淡入动画
            window.addEventListener('scroll', handleScrollAnimation);

            // Floating Demos script
            const floatingDemos = document.querySelector('.floating-demos');
            console.log("Floating Demos Element:", floatingDemos); // 调试信息
            if (floatingDemos) {
                window.addEventListener('scroll', function() {
                    const scrollY = window.scrollY;
                    const windowHeight = window.innerHeight;
                    
                    if (scrollY > 100) {
                        floatingDemos.classList.add('scrolled');
                    } else {
                        floatingDemos.classList.remove('scrolled');
                    }
                    
                    if (scrollY > windowHeight * 0.3 && scrollY < windowHeight * 1.2) {
                        floatingDemos.classList.add('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    } else if (scrollY <= windowHeight * 0.3) {
                        floatingDemos.classList.remove('second-phase');
                        floatingDemos.classList.remove('third-phase');
                    }
                    
                    if (scrollY > windowHeight * 1.2) {
                        floatingDemos.classList.add('third-phase');
                        floatingDemos.classList.remove('second-phase');
                    }
                });
            }

            // Dataset Showcase Carousel
            console.log("Attempting to initialize Dataset Carousel..."); // 调试信息
            const dsCarousel = document.querySelector('.ds-carousel');
            console.log("Dataset Carousel Element:", dsCarousel); // 调试信息

            if (dsCarousel) {
                const items = dsCarousel.querySelectorAll('.ds-item');
                const prevButton = document.querySelector('.ds-carousel-wrapper .ds-prev');
                const nextButton = document.querySelector('.ds-carousel-wrapper .ds-next');
                const dotsContainer = document.querySelector('.ds-carousel-wrapper .ds-dots');
                let currentIndex = 0;
                let autoPlayInterval;

                console.log("Carousel items found:", items.length); // 调试信息
                console.log("Prev button:", prevButton); // 调试信息
                console.log("Next button:", nextButton); // 调试信息
                console.log("Dots container:", dotsContainer); // 调试信息

                function showItem(index) {
                    items.forEach((item, i) => {
                        item.classList.remove('active');
                        if (i === index) {
                            item.classList.add('active');
                        }
                    });
                    if (dotsContainer) updateDots(index);
                }

                function updateDots(index) {
                    if (!dotsContainer) return;
                    const dots = dotsContainer.querySelectorAll('.ds-dot');
                    dots.forEach((dot, i) => {
                        dot.classList.remove('active');
                        if (i === index) {
                            dot.classList.add('active');
                        }
                    });
                }

                function createDots() {
                    if (!dotsContainer) return;
                    dotsContainer.innerHTML = ''; // Clear existing dots if any
                    items.forEach((_, i) => {
                        const dot = document.createElement('button');
                        dot.classList.add('ds-dot');
                        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
                        dot.addEventListener('click', () => {
                            currentIndex = i;
                            showItem(currentIndex);
                            resetAutoPlay();
                        });
                        dotsContainer.appendChild(dot);
                    });
                }

                function nextItemManual() {
                    currentIndex = (currentIndex + 1) % items.length;
                    showItem(currentIndex);
                }

                function prevItemManual() {
                    currentIndex = (currentIndex - 1 + items.length) % items.length;
                    showItem(currentIndex);
                }
                
                function startAutoPlay(interval = 5000) {
                    stopAutoPlay();
                    if (items.length > 1) { // Only autoplay if more than one item
                        autoPlayInterval = setInterval(nextItemManual, interval);
                    }
                }

                function stopAutoPlay() {
                    clearInterval(autoPlayInterval);
                }

                function resetAutoPlay(interval = 5000) {
                    stopAutoPlay();
                    startAutoPlay(interval);
                }

                if (items.length > 0) {
                    createDots();
                    showItem(currentIndex);
                    startAutoPlay();

                    if (prevButton) {
                        prevButton.addEventListener('click', () => {
                            prevItemManual();
                            resetAutoPlay();
                        });
                    }
                    if (nextButton) {
                        nextButton.addEventListener('click', () => {
                            nextItemManual();
                            resetAutoPlay();
                        });
                    }
                    
                    // Pause autoplay on hover
                    const carouselWrapper = document.querySelector('.ds-carousel-wrapper');
                    if (carouselWrapper) {
                        carouselWrapper.addEventListener('mouseenter', stopAutoPlay);
                        carouselWrapper.addEventListener('mouseleave', () => resetAutoPlay());
                    }
                } else {
                    console.log("No items found for the dataset carousel."); // 调试信息
                }
            } else {
                console.log("Dataset carousel element (.ds-carousel) not found."); // 调试信息
            }
        });
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            // ... (call to handleScrollAnimation, floatingDemos init) ...
            console.log("DOM fully loaded and parsed for new Dataset Showcase.");

            const datasetShowcaseSection = document.getElementById('dataset-showcase');
            if (datasetShowcaseSection) {
                console.log("Dataset Showcase Section found.");
                const mainImageEl = document.getElementById('ds-main-image-display');
                const mainTitleEl = document.getElementById('ds-main-title-display');
                const mainDescriptionEl = document.getElementById('ds-main-description-display');
                const thumbnailNavContainer = datasetShowcaseSection.querySelector('.ds-thumbnail-navigation');
                const datasetEntries = document.querySelectorAll('#dataset-definitions .dataset-entry');

                let datasets = [];
                datasetEntries.forEach(entry => {
                    datasets.push({
                        imgSrc: entry.dataset.imgSrc,
                        title: entry.dataset.title,
                        description: entry.dataset.description
                    });
                });

                console.log("Datasets loaded:", datasets.length, datasets);

                function updateMainDisplay(index) {
                    if (!datasets[index]) {
                        console.error("Dataset not found for index:", index);
                        return;
                    }
                    const currentData = datasets[index];
                    
                    if (mainImageEl) mainImageEl.src = currentData.imgSrc;
                    if (mainImageEl) mainImageEl.alt = currentData.title + " main image";
                    
                    if (mainTitleEl) {
                        mainTitleEl.textContent = currentData.title;
                        // Apply special styling for the second title (HQ-Poster-100K) or any other logic
                        // The Leonardo.ai "Interior Design" is the second item in their list
                        if (index === 1) { // 0-indexed, so 1 is the second item
                            mainTitleEl.classList.add('highlight');
                        } else {
                            mainTitleEl.classList.remove('highlight');
                        }
                    }
                    if (mainDescriptionEl) mainDescriptionEl.textContent = currentData.description;

                    // Update active state for thumbnails
                    const currentThumbnails = thumbnailNavContainer.querySelectorAll('.ds-thumbnail-item');
                    currentThumbnails.forEach((thumb, i) => {
                        thumb.classList.toggle('active', i === index);
                    });
                }

                function populateThumbnails() {
                    if (!thumbnailNavContainer) {
                        console.error("Thumbnail navigation container not found.");
                        return;
                    }
                    thumbnailNavContainer.innerHTML = ''; // Clear existing thumbnails
                    datasets.forEach((data, index) => {
                        const thumbItem = document.createElement('div');
                        thumbItem.classList.add('ds-thumbnail-item');
                        thumbItem.dataset.index = index;

                        const thumbImg = document.createElement('img');
                        thumbImg.src = data.imgSrc; // Using main image for thumbnail as per previous setup
                        thumbImg.alt = data.title + " thumbnail";
                        
                        thumbItem.appendChild(thumbImg);
                        thumbItem.addEventListener('click', function() {
                            updateMainDisplay(index);
                        });
                        thumbnailNavContainer.appendChild(thumbItem);
                    });
                }

                if (datasets.length > 0) {
                    populateThumbnails();
                    updateMainDisplay(0); // Display the first dataset initially
                } else {
                    console.log("No dataset entries found to populate showcase.");
                }
            } else {
                console.log("Dataset Showcase Section NOT found.");
            }
             // Smooth scroll (if not already present or if you want it self-contained here)
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        targetElement.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });

        // Dataset Showcase Tabs - 3-tab version with dynamic layout
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Initializing 3-tab Dataset Showcase...");
            
            const tabButtons = document.querySelectorAll('.ds-tab-button');
            const contentSections = document.querySelectorAll('.ds-dataset-content');
            const tabNavigation = document.querySelector('.ds-tab-navigation');
            
            if (tabButtons.length > 0 && contentSections.length > 0 && tabNavigation) {
                
                function showDataset(index) {
                    // Remove active class from all buttons and content
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    contentSections.forEach(content => content.classList.remove('active'));
                    
                    // Update navigation layout class
                    tabNavigation.className = 'ds-tab-navigation active-' + index;
                    
                    // Add active class to selected button and content
                    if (tabButtons[index]) {
                        tabButtons[index].classList.add('active');
                    }
                    if (contentSections[index]) {
                        contentSections[index].classList.add('active');
                    }
                    
                    console.log("Showing dataset:", index);
                }
                
                // Add click event listeners
                tabButtons.forEach((button, index) => {
                    button.addEventListener('click', () => {
                        showDataset(index);
                    });
                });
                
                // Initialize with middle tab active (index 1)
                showDataset(1);
                
                // Auto-rotation every 5 seconds (optional)
                let currentIndex = 1;
                setInterval(() => {
                    currentIndex = (currentIndex + 1) % 3;
                    showDataset(currentIndex);
                }, 5000);
                
                console.log("3-tab Dataset Showcase initialized!");
            }
        });

        // Dataset Showcase Infinite Carousel
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Initializing Infinite Dataset Carousel...");
            
            const carousel = document.getElementById('ds-carousel');
            const contentSections = document.querySelectorAll('.ds-dataset-content');
            
            if (!carousel || contentSections.length === 0) {
                console.log("Carousel elements not found");
                return;
            }
            
            const datasets = [
                'Text-Render-2M',
                'HQ-Poster-100K', 
                'Poster-Preference-100K'
            ];
            
            let currentIndex = 1; // 从中间开始
            let isAnimating = false;
            
            // 创建无限循环的按钮组
            function createCarouselButtons() {
                carousel.innerHTML = '';
                
                // 创建5个按钮实现视觉上的无限循环
                for (let i = -2; i <= 2; i++) {
                    const button = document.createElement('button');
                    button.className = 'ds-tab-button';
                    
                    const span = document.createElement('span');
                    span.className = 'ds-tab-text';
                    
                    const dataIndex = (currentIndex + i + datasets.length) % datasets.length;
                    span.textContent = datasets[dataIndex];
                    button.appendChild(span);
                    
                    // 设置位置样式
                    if (i === 0) {
                        button.classList.add('center');
                    } else if (Math.abs(i) === 1) {
                        button.classList.add('adjacent');
                    } else {
                        button.classList.add('far');
                    }
                    
                    // 添加点击事件
                    button.addEventListener('click', () => {
                        if (isAnimating) return;
                        scrollToIndex(dataIndex);
                    });
                    
                    carousel.appendChild(button);
                }
            }
            
            function scrollToIndex(targetIndex) {
                if (isAnimating || targetIndex === currentIndex) return;
                
                isAnimating = true;
                
                // 计算滚动方向
                let direction = targetIndex - currentIndex;
                if (Math.abs(direction) > 1) {
                    // 处理边界情况（0->2 或 2->0）
                    direction = direction > 0 ? direction - datasets.length : direction + datasets.length;
                }
                
                currentIndex = targetIndex;
                
                // 更新内容显示
                showContent(currentIndex);
                
                // 重新创建按钮以实现滚动效果
                setTimeout(() => {
                    createCarouselButtons();
                    isAnimating = false;
                }, 100);
            }
            
            function showContent(index) {
                contentSections.forEach(content => content.classList.remove('active'));
                if (contentSections[index]) {
                    contentSections[index].classList.add('active');
                }
            }
            
            // 自动轮播
            function startAutoPlay() {
                setInterval(() => {
                    if (!isAnimating) {
                        const nextIndex = (currentIndex + 1) % datasets.length;
                        scrollToIndex(nextIndex);
                    }
                }, 4000);
            }
            
            // 初始化
            createCarouselButtons();
            showContent(currentIndex);
            startAutoPlay();
            
            console.log("Infinite Dataset Carousel initialized!");
        });

        function updateCarouselPosition(offset) {
            const centerOffset = -4 * 6; // 改为6rem间距，从8改为6
            const totalOffset = centerOffset + offset;
            carousel.style.transform = `translateX(calc(50% + ${totalOffset}rem))`;
        }

        function slideToIndex(targetIndex, clickedPosition) {
            if (isAnimating || targetIndex === currentIndex) return;
            
            isAnimating = true;
            
            // 计算滑动距离
            const slideDistance = -clickedPosition * 6; // 改为6rem间距，从8改为6
            
            // 执行滑动动画
            updateCarouselPosition(slideDistance);
            
            // 更新当前索引
            currentIndex = targetIndex;
            
            // 更新内容显示
            updateContent(currentIndex);
            
            // 动画完成后重新生成按钮
            setTimeout(() => {
                createInfiniteButtons();
                isAnimating = false;
            }, 1200);
        }
    </script>
</body>
</html>
